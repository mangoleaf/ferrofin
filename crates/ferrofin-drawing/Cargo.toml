[package]
name = "ferrofin-drawing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Image processing for Ferrofin (port of Jellyfin.Drawing + Emby.Photos)."

[lints]
workspace = true

[dependencies]
ferrofin-util.workspace = true
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-common.workspace = true
async-trait.workspace = true
chrono.workspace = true
image.workspace = true
kamadak-exif.workspace = true
webp.workspace = true
jpeg-encoder.workspace = true
jpeg-decoder.workspace = true
blurhash.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# kamadak-exif's library is named `exif`, which cargo-machete cannot map back to it.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif"]

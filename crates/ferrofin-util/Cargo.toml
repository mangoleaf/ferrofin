[package]
name = "ferrofin-util"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leaf utilities for Ferrofin (port of Jellyfin.Extensions)."

[lints]
workspace = true

[dependencies]
# `process_priority`'s `ChildProcess` for `tokio::process::Child`, and the
# async mutexes of `keyed_locks`.
tokio = { workspace = true, optional = true }
uuid.workspace = true
thiserror.workspace = true
rand.workspace = true
unicode-normalization.workspace = true
regex.workspace = true
icu_casemap.workspace = true
icu_collator.workspace = true
icu_locale_core.workspace = true
icu_collections.workspace = true
icu_locale_fallback.workspace = true
icu_normalizer.workspace = true
icu_provider.workspace = true
zerovec.workspace = true

[features]
# `process_priority::ChildProcess` for `tokio::process::Child`, and `keyed_locks`.
tokio = ["dep:tokio"]

# `process_priority`: the OS priority of background ffmpeg/ffprobe processes.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rstest.workspace = true

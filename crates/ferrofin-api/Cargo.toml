[package]
name = "ferrofin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP/REST API for Ferrofin (port of Jellyfin.Api) — axum handlers over the ferrofin-traits managers."

[lints]
workspace = true

[features]
# Fake `ferrofin-traits` manager impls (test doubles) for exercising the router,
# auth, and contract in isolation — pulled in by this crate's own tests via the
# dev-dependency below. The fakes add only trait *impls*; the entity/DTO types
# they name come from `ferrofin-db`, which is now a plain dependency (the real
# handlers also project `UserManager`/`LibraryManager` results, whose types live
# in `ferrofin-db`), so this feature no longer toggles an optional dep.
test-util = []

[dependencies]
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-health.workspace = true
# The `NetworkConfiguration` DTO returned by `GET /System/Configuration/network`.
ferrofin-networking.workspace = true
# The MD5 id-derivation helper (`GetMD5`) the display-preferences controller
# uses to hash a non-Guid `displayPreferencesId` into a stable item id.
ferrofin-common.workspace = true
# `guid_extensions::parse_dotnet_guid` — the .NET `Guid.TryParse` format set
# ASP.NET binds a `Guid?` query parameter with, which is not `Uuid::parse_str`'s.
ferrofin-util.workspace = true
# The manager traits return `ferrofin-db` entity types (`UserEntity`,
# `BaseItemEntity`, …); the real handlers name them when projecting to DTOs, so
# this is a plain (non-optional) dependency.
ferrofin-db.workspace = true
axum = { workspace = true, features = ["ws", "macros"] }
serde_path_to_error.workspace = true
axum-extra.workspace = true
chrono.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "trace", "cors", "compression-gzip", "compression-br"] }
tokio = { workspace = true }
# The `Stream` impl behind the progressive Live TV response bodies.
futures-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
utoipa.workspace = true
uuid.workspace = true
tracing.workspace = true
# Read the OTel trace_id off the request span for log↔trace correlation. No
# exporter here — that lives in ferrofin-server; these are API-only helpers.
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
# Self dev-dependency so unit + integration tests build with the `test-util`
# fakes (the composition-root deps are unavailable at this layer by design).
ferrofin-api = { path = ".", features = ["test-util"] }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_urlencoded.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The /socket tests drive a real WebSocket against a real listener — the
# push path cannot be exercised through `tower::oneshot`.
tokio-tungstenite.workspace = true
futures-util.workspace = true
tower.workspace = true
tempfile.workspace = true
# Trace-correlation test: an in-memory span exporter + a scoped OTel subscriber.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true
# Response-compression tests decode what the layer encoded, to prove the
# decompressed bytes are byte-identical to the uncompressed response.
flate2.workspace = true
brotli.workspace = true

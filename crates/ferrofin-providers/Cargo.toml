[package]
name = "ferrofin-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Metadata providers for Ferrofin (port of MediaBrowser.Providers + XbmcMetadata + LocalMetadata)."

[lints]
workspace = true

[features]
# Every remote provider, OpenSubtitles and LrcLib included, is compiled in
# unconditionally and gated at runtime by the per-library fetcher checkboxes:
# there is deliberately no cargo feature for any of them.
#
# Test-only hooks for other crates' tests (`rate_limit::test_support`,
# `destination::test_support`). Enable it from `[dev-dependencies]` only: no
# production build may contain it.
test-util = []

[dependencies]
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-naming.workspace = true
ferrofin-util = { workspace = true, features = ["tokio"] }
ferrofin-common.workspace = true
ferrofin-db.workspace = true
ferrofin-health.workspace = true
# The CIDR parsing and matching of the image downloads' private allow-list
# (`destination::PrivateAllowList`).
ferrofin-networking.workspace = true
async-trait.workspace = true
# `join_all`: a search and an image listing ask their providers together.
futures-util.workspace = true
indexmap.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
sevenz-rust2.workspace = true
# A PDF's Standard security handler (`books/page_count/crypt.rs`), opened with
# the empty user password to read its encrypted object streams.
aes.workspace = true
md-5.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
# Provider request metrics (docs/conventions/METRICS.md rule 8): the OTel API
# only; the pipeline lives in ferrofin-metrics.
opentelemetry.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rstest.workspace = true
tempfile.workspace = true
# Writes the `.cb7` fixtures of the comic cover tests.
sevenz-rust2 = { workspace = true, features = ["compress"] }
chrono.workspace = true
uuid.workspace = true

# md-5's library is named `md5`, which cargo-machete cannot map back to it.
[package.metadata.cargo-machete]
ignored = ["md-5"]

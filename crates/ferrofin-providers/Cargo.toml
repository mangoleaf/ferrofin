[package]
name = "ferrofin-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Metadata providers for Ferrofin (port of MediaBrowser.Providers + XbmcMetadata + LocalMetadata)."

[lints]
workspace = true

[features]
# `opensubtitles` is on by default: the provider is compiled in (like a stock
# Jellyfin with the plugin installed) but inert until credentials are configured
# via the dashboard plugin page.
# `lrclib` is on by default: like TMDB (whose client is always compiled and
# works keyless out of the box), lrclib.net needs no key, so the lyric provider
# ships enabled — a stock Jellyfin with the LrcLib plugin installed.
#
# Everything else (TMDB/TVDB/OMDb/fanart/MusicBrainz/Studio Images) is compiled
# in unconditionally and gated at runtime by the per-library fetcher checkboxes
# — there is deliberately no cargo feature for those.
default = ["opensubtitles", "lrclib"]
opensubtitles = []
lrclib = []

[dependencies]
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-common.workspace = true
ferrofin-db.workspace = true
async-trait.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
chrono.workspace = true
uuid.workspace = true

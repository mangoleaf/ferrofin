                        updateButtons(page, state);
                        Dashboard.hideLoadingMsg();
                    });
                }

                /**
                 * Whether a restart has finished: the server answers, and has
                 * none pending. A refusal counts, for `load` to show. Plain
                 * `fetch`: a failed GET through ApiClient starts its reconnect,
                 * which may move it to another of the server's addresses.
                 */
                function restartFinished() {
                    var headers = { accept: 'application/json' };
                    ApiClient.setRequestHeaders(headers);
                    return fetch(ApiClient.getUrl('Ferrofin/Settings'), { headers: headers, cache: 'no-store' }).then(function (response) {
                        if (!response.ok) {
                            return response.status < 500;
                        }
                        return response.json().then(function (settings) {
                            return !settings.RestartPending;
                        });
                    }).catch(function () {
                        return false;
                    });
                }

                /** Resolves to whether the restart finished before `deadline`. */
                function waitForRestart(deadline) {
                    return restartFinished().then(function (finished) {
                        if (finished || Date.now() >= deadline) {
                            return finished;
                        }
                        return new Promise(function (resolve) {
                            setTimeout(resolve, RESTART_POLL_MS);
                        }).then(function () {
                            return waitForRestart(deadline);
                        });
                    });
                }

                /** Puts the notice back after a restart that did not finish. */
                function endRestart(page, state, text) {
                    state.restarting = false;
                    updateButtons(page, state);
                    page.querySelector('.ferrofinRestartText').textContent = state.restartText;
                    showNotice(page, text);
                }

                /** Restarts the server and shows the settings it comes back with. */
                function restart(page, state) {
                    state.restarting = true;
                    updateButtons(page, state);
                    page.querySelector('.ferrofinRestartText').textContent = 'Restarting the server…';
                    ApiClient.restartServer().catch(function (failure) {
                        // A dropped connection may be the restart itself.
                        if (failure && failure.status) {
                            throw failure;
                        }
                    }).then(function () {
                        return waitForRestart(Date.now() + RESTART_WAIT_MS);
                    }).then(function (finished) {
                        if (!finished) {
                            endRestart(page, state, 'The server has not finished restarting. Reload this page once it answers.');
                            return;
                        }
                        state.restarting = false;
                        load(page, state);
                    }, function (failure) {
                        endRestart(page, state, 'Could not restart the server (HTTP ' + failure.status + ').');
                    });
                }

                function bind(page) {
                    // `resets` and `processRestart` hold what this page saved
                    // since the last restart; `tab` is the group whose tab is
                    // open; `rows` are the settings shown, `fields` the
                    // editable ones.
                    var state = {
                        fields: [],
                        rows: [],
                        resets: Object.create(null),
                        processRestart: Object.create(null),
                        saving: false,
                        restarting: false,
                        restartText: RESTART_PENDING,
                        tab: null
                    };
                    page.setAttribute('data-ferrofin-bound', 'true');
                    page.addEventListener('pageshow', function () {
                        if (!state.restarting) {
                            load(page, state);
                        }
                    });
                    var tabs = page.querySelector('.ferrofinTabs');
                    tabs.addEventListener('click', function (event) {
                        var tab = event.target.closest('.ferrofinTab');
                        if (tab) {
                            selectTab(page, state, tab.getAttribute('data-group'));
                        }
                    });
                    tabs.addEventListener('keydown', function (event) {
                        moveTab(page, state, event);
                    });
                    // The search and the filters apply as they change; an edit
                    // never hides the row it is made in.
                    var find = page.querySelector('.ferrofinFinder');
                    find.addEventListener('input', function () {
                        applyView(page, state);
                    });
                    find.addEventListener('change', function () {
                        applyView(page, state);
                    });
                    page.querySelector('.ferrofinSearch').addEventListener('keydown', function (event) {
                        // Enter searches; it does not save.
                        if (event.key === 'Enter') {
                            event.preventDefault();
                        }
                    });
                    var form = page.querySelector('.ferrofinForm');
                    function changed() {
                        updateTabs(page, state);
                        updateButtons(page, state);
                    }
                    form.addEventListener('input', changed);
                    form.addEventListener('change', changed);
                    form.addEventListener('submit', function (event) {
                        event.preventDefault();
                        save(page, state);
                    });
                    page.querySelector('.ferrofinRestartNow').addEventListener('click', function () {
                        if (Object.keys(changes(state)).length === 0) {
                            restart(page, state);
                            return;
                        }
                        Dashboard.confirm('The changes you have not saved will be lost.', 'Restart now', function (confirmed) {
                            if (confirmed) {
                                restart(page, state);
                            }
                        });
                    });
                }

                // jellyfin-web keeps earlier views in the document, so this
                // script binds only the page it was loaded with: the one not
                // bound yet. `pageshow` fires on each visit, a return to the
                // cached view included, and reloads the settings.
                document.querySelectorAll('.ferrofinSettingsPage').forEach(function (page) {
                    if (page.getAttribute('data-ferrofin-bound') !== 'true') {
                        bind(page);
                    }
                });
            }());
        </script>
    </div>
</body>

</html>

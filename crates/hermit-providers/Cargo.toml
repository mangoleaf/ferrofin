[package]
name = "hermit-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Metadata providers for Hermit (port of MediaBrowser.Providers + XbmcMetadata + LocalMetadata)."

[lints]
workspace = true

[features]
# Remote API providers (need keys, network) — deferred/off by default for First-Light.
# `opensubtitles` is on by default: the provider is compiled in (like a stock
# Jellyfin with the plugin installed) but inert until credentials are configured
# via the dashboard plugin page.
# `lrclib` is on by default: like TMDB (whose client is always compiled and
# works keyless out of the box), lrclib.net needs no key, so the lyric provider
# ships enabled — a stock Jellyfin with the LrcLib plugin installed.
default = ["opensubtitles", "lrclib"]
tmdb = []
musicbrainz = []
omdb = []
studios = []
tvdb = []
opensubtitles = []
lrclib = []

[dependencies]
hermit-traits.workspace = true
hermit-model.workspace = true
hermit-common.workspace = true
hermit-db.workspace = true
async-trait.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
chrono.workspace = true
uuid.workspace = true

[package]
name = "ferrofin-networking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Network/bind/published-URL resolution for Ferrofin (port of Jellyfin.Networking)."

[lints]
workspace = true

[dependencies]
if-addrs.workspace = true
ferrofin-model.workspace = true
ferrofin-util.workspace = true
serde.workspace = true
fancy-regex.workspace = true
percent-encoding.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
# Paused-clock tests of the network-change wait (tokio::time::pause).
tokio = { workspace = true, features = ["test-util"] }
rstest.workspace = true
serde_json.workspace = true
# Reads what `TracingLogger` writes.
tracing-subscriber.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

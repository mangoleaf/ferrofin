[package]
name = "ferrofin-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Tier-1b WASM plugin host: loads sandboxed component-model plugins from {data_dir}/plugins."

[lints]
workspace = true

[dependencies]
ferrofin-traits.workspace = true
ferrofin-core.workspace = true
ferrofin-db.workspace = true
ferrofin-providers.workspace = true
chrono.workspace = true
ferrofin-model.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
# `blocking` because host functions run on the plugin's own OS thread (not a
# tokio worker), where a blocking client is the simplest correct shape.
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
wat.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

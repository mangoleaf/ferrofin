<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermit ⇄ Jellyfin parity ledger</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef; --muted: #8b93a7;
    --ok: #3fb950; --warn: #d29922; --none: #6e7681; --accent: #58a6ff;
    --real: #3fb950; --partial: #d29922; --hollow: #db6d28; --stub: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 28px 24px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; min-width: 120px;
  }
  .stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .bar { height: 8px; border-radius: 6px; overflow: hidden; display: flex; margin-top: 14px; background: var(--line); }
  .bar > span { display: block; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px; position: sticky; top: 0;
    background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  input, select {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=search] { flex: 1 1 260px; }
  main { padding: 0 24px 48px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 61px; background: var(--bg); color: var(--muted); font-weight: 600;
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
  th:hover { color: var(--fg); }
  tbody tr:hover { background: #12151c; }
  code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .op { white-space: nowrap; }
  .method { font-weight: 700; margin-right: 6px; }
  .m-GET { color: #58a6ff; } .m-POST { color: #3fb950; } .m-PUT { color: #d29922; }
  .m-DELETE { color: #f85149; } .m-PATCH { color: #bc8cff; } .m-HEAD { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    border: 1px solid transparent; }
  .d-REAL { color: var(--real); border-color: #204a2b; background: #10261699; }
  .d-PARTIAL { color: var(--partial); border-color: #4a3a10; background: #26200f99; }
  .d-HOLLOW { color: var(--hollow); border-color: #4a2e14; background: #26160f99; }
  .d-STUB { color: var(--stub); border-color: #4a1c1c; background: #260f0f99; }
  .r-registered { color: var(--muted); }
  .r-501-stub { color: var(--stub); }
  .deep { font-size: 15px; }
  .class { color: var(--muted); font-size: 12.5px; max-width: 520px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Hermit ⇄ Jellyfin parity ledger</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
</header>
<div class="controls">
  <input type="search" id="q" placeholder="Filter by operation, classification…">
  <select id="fdepth"><option value="">depth: all</option></select>
  <select id="froute"><option value="">route: all</option></select>
  <select id="fdeep">
    <option value="">deep: all</option>
    <option value="true">✅ verified</option>
    <option value="class">⚠️ classified</option>
    <option value="untested">· untested</option>
  </select>
</div>
<main>
  <table>
    <thead><tr>
      <th data-k="operation">Operation</th>
      <th data-k="route">Route</th>
      <th data-k="depth">Depth</th>
      <th data-k="status_conformant" title="Layer 1: HTTP status class matches Jellyfin">Status</th>
      <th data-k="schema_valid" title="Layer 1: response validates vs vendored schema">Schema</th>
      <th data-k="deep_verified" title="Layer 2: response + read-back diffed clean">Deep</th>
      <th data-k="classification">Classification</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No operations match.</div>
</main>
<script>
const st = { rows: [], sortK: "operation", sortDir: 1 };

const deepMark = v => v === true ? "✅" : v === false ? "⚠️" : "·";
const opParts = op => { const [m, ...p] = op.split(" "); return [m, p.join(" ")]; };

function stat(n, l, color) {
  return `<div class="stat"><div class="n" style="color:${color||'var(--fg)'}">${n}</div><div class="l">${l}</div></div>`;
}

function renderSummary() {
  const r = st.rows, total = r.length;
  const deep = r.filter(x => x.deep_verified === true).length;
  const cls = r.filter(x => x.classification && x.deep_verified !== true).length;
  const untested = total - deep - cls;
  document.getElementById("sub").textContent =
    `${total} operations · Jellyfin 10.11.8 contract · generated from ledger.json`;
  const scRun = r.filter(x => x.status_conformant !== null).length;
  const scOk = r.filter(x => x.status_conformant === true).length;
  const svRun = r.filter(x => x.schema_valid !== null).length;
  const svOk = r.filter(x => x.schema_valid === true).length;
  document.getElementById("stats").innerHTML =
    stat(deep, "deep-verified", "var(--ok)") +
    stat(cls, "classified", "var(--warn)") +
    stat(untested, "untested", "var(--none)") +
    stat(`${scOk}/${scRun}`, "status-conformant", "var(--accent)") +
    stat(`${svOk}/${svRun}`, "schema-valid", "var(--accent)");
  const seg = (n, c) => n ? `<span style="width:${100*n/total}%;background:${c}"></span>` : "";
  document.getElementById("bar").innerHTML =
    seg(deep, "var(--ok)") + seg(cls, "var(--warn)") + seg(untested, "var(--none)");
}

function fillSelect(id, key) {
  const vals = [...new Set(st.rows.map(x => x[key]))].sort();
  const sel = document.getElementById(id);
  vals.forEach(v => sel.insertAdjacentHTML("beforeend", `<option value="${v}">${v}</option>`));
}

function filtered() {
  const q = document.getElementById("q").value.toLowerCase();
  const fd = document.getElementById("fdepth").value;
  const fr = document.getElementById("froute").value;
  const fv = document.getElementById("fdeep").value;
  return st.rows.filter(x => {
    if (fd && x.depth !== fd) return false;
    if (fr && x.route !== fr) return false;
    if (fv === "true" && x.deep_verified !== true) return false;
    if (fv === "class" && !(x.classification && x.deep_verified !== true)) return false;
    if (fv === "untested" && (x.deep_verified !== null || x.classification)) return false;
    if (q && !(x.operation + " " + x.classification).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  let rows = filtered();
  rows.sort((a, b) => {
    let x = a[st.sortK], y = b[st.sortK];
    x = x === null ? "" : String(x); y = y === null ? "" : String(y);
    return x < y ? -st.sortDir : x > y ? st.sortDir : 0;
  });
  const body = document.getElementById("rows");
  document.getElementById("empty").hidden = rows.length > 0;
  body.innerHTML = rows.map(x => {
    const [m, path] = opParts(x.operation);
    return `<tr>
      <td class="op"><code><span class="method m-${m}">${m}</span>${path}</code></td>
      <td class="r-${x.route}">${x.route}</td>
      <td><span class="badge d-${x.depth}">${x.depth}</span></td>
      <td class="deep" title="${x.note||''}">${deepMark(x.status_conformant)}</td>
      <td class="deep" title="${x.note||''}">${deepMark(x.schema_valid)}</td>
      <td class="deep" title="${x.deep_verified===true?'verified':x.deep_verified===false?'classified':'untested'}">${deepMark(x.deep_verified)}</td>
      <td class="class">${x.classification || ""}</td>
    </tr>`;
  }).join("");
}

fetch("ledger.json").then(r => r.json()).then(data => {
  st.rows = data.operations;
  fillSelect("fdepth", "depth");
  fillSelect("froute", "route");
  renderSummary();
  render();
  ["q", "fdepth", "froute", "fdeep"].forEach(id =>
    document.getElementById(id).addEventListener("input", render));
  document.querySelectorAll("th[data-k]").forEach(th =>
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      st.sortDir = st.sortK === k ? -st.sortDir : 1;
      st.sortK = k;
      render();
    }));
}).catch(e => {
  document.getElementById("sub").textContent =
    "could not load ledger.json — serve this dir (e.g. `python3 -m http.server` in parity/) rather than opening the file directly.";
});
</script>
</body>
</html>

# The parity differences already filed as GitLab issues (`gl-<iid>`), so a run's report and its
# new-differences.json name the issue and `diff.py findings` does not offer them for filing again.
#
# A filed difference is still new: it fails the run until Ferrofin is fixed or the difference is accepted
# into ledger.toml. Add an entry here after filing (see parity/README.md, "Filing new differences").
#
#   request   the request id, or a glob over request ids (`GetItems.*`)
#   path      the field path as the report prints it (`Items[].UserData.Key`); `$status` for the status
#   kind      one kind or a list of status, value, type, null, missing, extra, length
#   issue     the GitLab issue number
#
# [[filed]]
# request = "GetItems.*"
# path = "TotalRecordCount"
# kind = "value"
# issue = 830

version = 1

# ── filed from the first sweep with the edge cases (gl-617, gl-618) ─────────────────────────────────
# A request is matched by the first entry whose pattern, path and kind fit, so the specific filters come
# first. A filter Ferrofin ignores shows as a different total (TotalRecordCount, value) and a different
# page (Items, length) when the filtered page is not full. The last TotalRecordCount entry is a deliberate
# catch-all: every other recursive /Items count is one higher on Ferrofin (the playlists folder, gl-826);
# a new GetItems total difference therefore reads as gl-826 until it is filed above it.
[[filed]]
request = "GetItems.hasParentalRating.false"
path = "TotalRecordCount"
kind = "value"
issue = 809

[[filed]]
request = "GetItems.hasOfficialRating.*"
path = "TotalRecordCount"
kind = "value"
issue = 809


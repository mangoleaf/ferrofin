# Hermit CI/CD — the canonical pipeline (GitLab is the source of truth).
#
# Stages:
#   test    — fmt / clippy / unit tests, plus the per-crate 80% coverage gate.
#   tag     — create-release (manual, main): cuts the release tag, gated on test.
#   build   — the server container image, built rootless with kaniko (tags only).
#   release — a GitLab Release object with git-cliff-generated notes.
#   chart   — the official Helm chart, pushed as an OCI artifact.
#
# The git tag is the single source of truth for the version. CI never edits
# version files: the release version is injected at build time — into the image
# via SERVICE_VERSION and into the chart via `helm --version/--app-version` — so
# the committed Cargo.toml/Chart.yaml versions stay as dev placeholders. To
# release, run the manual `create-release` job; it derives the next version and
# pushes a TAG on the commit it ran on (it does NOT commit to main). No hand-made tags.
#
# Tag scheme (see brain/plans/PLAN_RELEASE_STRATEGY.md):
#   vX.Y.Z        → image :X.Y.Z + :latest, GitLab Release, chart @ X.Y.Z
#   vX.Y.Z-rc.N   → image :X.Y.Z-rc.N only (never :latest, no release, no chart)
#   chart-vA.B.C  → chart only @ A.B.C
#   main commit   → dev image {M.m.p}-{N}-{sha12} when build-relevant paths change
#
# Portability: release logic is intentionally plain shell so a future move to
# GitHub Actions / Docker Hub is a matter of re-wiring triggers, not rewriting.
stages: [test, tag, build, release, chart]

# ---------------------------------------------------------------------------
# create-release — manual, main only. Derives the next version from Conventional
# Commit subjects since the last tag: feat -> minor, fix/other -> patch, breaking
# -> major (but while major is 0 a breaking change bumps MINOR — never auto-1.0.0).
# It then TAGS the commit it ran on and pushes ONLY the tag — no commit to main,
# so it needs no fast-forward and works even when main has moved on since (you can
# trigger it early / not at the tip). The tag pipeline builds + publishes; the
# release version is injected via SERVICE_VERSION, so Cargo.toml is left untouched.
#
# Override the auto-derived bump with FORCE_VERSION=vX.Y.Z when you need to.
# Requires CI/CD var RELEASE_TOKEN — a project access token (Maintainer) allowed
# to create the protected v* tags. (It no longer pushes the default branch.)
# ---------------------------------------------------------------------------
create-release:
  stage: tag
  # Manual (never auto-runs — when:manual below). `needs` makes it a DAG job, so
  # its play button is available from pipeline start: trigger it EARLY, while
  # lint/coverage are still running, and it runs once they succeed. If either
  # fails, the need is unmet and this job is skipped (cancelled) — a release can
  # never be cut from a red commit.
  needs:
    - job: lint
    - job: coverage
  image: alpine/git:latest        # has git + busybox awk/grep/sed; NO git-cliff
  variables:
    GIT_DEPTH: "0"   # need full history + tags to derive the bump from commits
  script:
    - |
      set -eu
      git config user.email "ci@mangoleafstudios.com"
      git config user.name "GitLab CI"
      git fetch --tags --quiet
      # Next version from git tags + Conventional Commits — logic lives in
      # scripts/version.sh (bats-tested, shellcheck-clean). FORCE_VERSION honored
      # inside. alpine/git has no bash, which the script needs.
      apk add --no-cache bash >/dev/null
      NEW=$(bash scripts/version.sh next)
      echo "Releasing ${NEW} (tagging ${CI_COMMIT_SHORT_SHA})"
      # Tag the commit this job ran on and push ONLY the tag — no commit to main.
      # A tag needs no fast-forward, so this succeeds even if main has moved on
      # since the pipeline started (you can trigger the release early / not at the
      # tip). The release version is injected at build time via SERVICE_VERSION
      # (the tag); Cargo.toml is intentionally left untouched.
      git tag -a "$NEW" -m "release $NEW"
      git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "$NEW"
      echo "Pushed tag ${NEW}; the tag pipeline builds and publishes."
      # This commit is now being released, so the tag pipeline will build the
      # release image — cancel THIS main pipeline's now-redundant dev image build
      # (docker-image is still pending: it's in a later stage than this one).
      # Best-effort: never fail the release over the cleanup. Needs RELEASE_TOKEN
      # to have the `api` scope; without it the cancel just no-ops.
      apk add --no-cache curl jq >/dev/null 2>&1 || true
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      JOB_ID=$(curl -sf --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" "$API/pipelines/$CI_PIPELINE_ID/jobs?per_page=100" 2>/dev/null | jq -r '.[] | select(.name=="docker-image") | .id' | sed -n 1p || true)
      if [ -n "${JOB_ID:-}" ]; then
        echo "Cancelling redundant docker-image job ${JOB_ID} in pipeline ${CI_PIPELINE_ID}"
        curl -sf --request POST --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" "$API/jobs/$JOB_ID/cancel" >/dev/null 2>&1 \
          || echo "  cancel failed (grant RELEASE_TOKEN the api scope to enable this) — non-fatal"
      else
        echo "No docker-image job in this pipeline to cancel."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# ci-image — the Rust CI base image (toolchain + rustfmt/clippy/nextest/llvm-cov),
# built with kaniko and pushed to $CI_REGISTRY_IMAGE/ci:rust-1.97.0. The lint and
# coverage jobs use it as their `image:` so they don't reinstall tools every run.
# Rebuilds automatically when ci/Dockerfile changes on main; force a rebuild
# otherwise by running a pipeline with REBUILD_CI_IMAGE set. Lives in .pre so it
# publishes before the test stage.
#
# IMPORTANT: this job must be ABSENT from a pipeline when it shouldn't build — NOT
# present-as-manual. lint/coverage carry an optional `needs: ci-image`, and an
# optional need is only ignored when the job is absent; a present-but-unplayed
# manual job would instead skip lint/coverage. So there is no `when: manual` rule.
# ---------------------------------------------------------------------------
ci-image:
  stage: .pre
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_IMAGE: $CI_REGISTRY_IMAGE/ci:rust-1.97.0
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile"
      --destination "$CI_IMAGE"
      --push-retry 5
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/Dockerfile
    - if: '$REBUILD_CI_IMAGE'   # force a rebuild: run a pipeline with this var set

# ---------------------------------------------------------------------------
# sccache — compile cache backed by Garage S3, replacing GitLab's cache: (which
# zipped target/ + .cargo into one archive and timed out uploading to Garage).
# sccache stores each object directly over S3 instead. Creds come from Vault;
# the rust jobs install the sccache binary and point RUSTC_WRAPPER at it. Reuses
# the same bucket / Vault role / secret as the rest workspace — no new infra.
# ---------------------------------------------------------------------------
sccache-creds:
  stage: .pre
  image: alpine:3
  variables:
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    SCCACHE_VAULT_PATH: "secret/data/gitlab/sccache"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      VAULT_TOKEN="$(curl -sf --request POST --data "{\"role\":\"gitlab-ci\",\"jwt\":\"$JWT\"}" "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')"
      SECRET="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$SCCACHE_VAULT_PATH")"
      echo "SCCACHE_ACCESS_KEY=$(echo "$SECRET" | jq -r '.data.data.accesskey')" >> sccache.env
      echo "SCCACHE_SECRET_KEY=$(echo "$SECRET" | jq -r '.data.data.secretkey')" >> sccache.env
  artifacts:
    reports:
      dotenv: sccache.env

# SCCACHE_* env + the optional dep on the creds job. Rust jobs `extends` this.
.sccache:
  variables:
    SCCACHE_VERSION: "0.16.0"
    SCCACHE_BUCKET: gitlab-sccache
    SCCACHE_REGION: garage
    SCCACHE_ENDPOINT: http://garage.garage.svc.cluster.local:3900
    SCCACHE_S3_USE_SSL: "false"
  needs:
    - job: sccache-creds
      optional: true
    # When ci-image runs (ci/Dockerfile changed) wait for it, so the base image is
    # published before lint/coverage pull it; ignored on runs where it's skipped.
    - job: ci-image
      optional: true

# Install the sccache binary and enable it when Vault creds are present.
# !reference'd as the first step of each rust job's before_script.
.sccache-setup:
  script:
    - |
      curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
        | tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/sccache'
      chmod +x /usr/local/bin/sccache
      if [ -n "${SCCACHE_ACCESS_KEY:-}" ]; then
        export RUSTC_WRAPPER=sccache
        export AWS_ACCESS_KEY_ID="$SCCACHE_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SCCACHE_SECRET_KEY"
        echo ">>> sccache ON -> $SCCACHE_ENDPOINT/$SCCACHE_BUCKET"
      else
        echo ">>> sccache OFF (no creds — compiling uncached)"
      fi

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
lint:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci:rust-1.97.0   # toolchain + nextest/llvm-cov baked in
  extends: .sccache
  variables:
    CARGO_TERM_COLOR: always
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - !reference [.sccache-setup, script]
  script:
    - cargo fmt --all --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo nextest run --workspace
    - cargo test --workspace --doc   # nextest can't run doctests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'

# Per-crate 80% line-coverage gate. Gate EACH crate independently: a merged
# `-p a -p b --fail-under-lines` check lets a sub-80% crate hide behind a
# stronger sibling. Line coverage only (branch needs nightly; we pin stable).
# Runs on MRs and main — a tag is cut from an already-green main, so it is not
# re-gated on the release pipeline.
coverage:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci:rust-1.97.0   # toolchain + nextest/llvm-cov baked in
  extends: .sccache
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - !reference [.sccache-setup, script]
  script:
    - |
      set -euo pipefail
      fail=0
      while read -r crate; do
        [ -z "$crate" ] && continue
        case "$crate" in \#*) continue ;; esac
        echo "── coverage: $crate ──"
        cargo llvm-cov nextest -p "$crate" --fail-under-lines 80 --summary-only || fail=1
      done < .port/gated-crates.txt
      exit $fail
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# image-version — computes the server image's version and exports it as a dotenv,
# because the kaniko job (docker-image) has no git. On a release tag the version
# is the tag; otherwise it is a describe-style dev version
#   {Major}.{Minor}.{Patch}-{N}-{sha12}
# where {Major.Minor.Patch} is the last release tag and {N} is the count of
# commits since that tag that touched build-relevant paths (crates / apps /
# Cargo.toml / Cargo.lock / Dockerfile). This lets us publish a testable image
# for any build-worthy commit WITHOUT cutting a release. Same rules as
# docker-image, so the two are always present together; docker-image inherits
# this dotenv via stage ordering (no `needs`, so the test stage still gates it).
# ---------------------------------------------------------------------------
image-version:
  stage: .pre
  image: alpine/git:latest
  variables:
    GIT_DEPTH: "0"   # full history + tags to count build-relevant commits
  script:
    - |
      set -eu
      # Version logic lives in scripts/version.sh (bats-tested, shellcheck-clean).
      # alpine/git has no bash, which the script needs.
      apk add --no-cache bash >/dev/null
      git fetch --tags --quiet
      printf 'IMAGE_VERSION=%s\n' "$(bash scripts/version.sh image)" | tee image.env
  artifacts:
    reports:
      dotenv: image.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - crates/**/*
        - apps/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile

# ---------------------------------------------------------------------------
# build — server image (kaniko, no Docker daemon: the homelab runner is in k3s).
# Builds on a release tag AND on a build-worthy main commit (dev image); the
# version + :latest decision come from image-version's dotenv.
# ---------------------------------------------------------------------------
docker-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE: $CI_REGISTRY_IMAGE
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      # IMAGE_VERSION comes from the image-version job's dotenv.
      DESTS="--destination $IMAGE:$IMAGE_VERSION"
      # :latest tracks FINAL releases ONLY — never a -rc or a dev/main build. The
      # single source of truth for that is this regex on the tag, right here at the
      # push site, so no other job can move :latest.
      if echo "${CI_COMMIT_TAG:-}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        DESTS="$DESTS --destination $IMAGE:latest"
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg SERVICE_VERSION="$IMAGE_VERSION"
      $DESTS
      --push-retry 5
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - crates/**/*
        - apps/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile

# ---------------------------------------------------------------------------
# release — GitLab Release with git-cliff notes (final versions only)
# ---------------------------------------------------------------------------
release-notes:
  stage: release
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0                               # git-cliff needs full history + tags
  script:
    - git-cliff --current --strip header -o release_notes.md
    - cat release_notes.md
  artifacts:
    paths: [release_notes.md]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-notes]
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Hermit $CI_COMMIT_TAG"
    description: release_notes.md
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ---------------------------------------------------------------------------
# chart — official Helm chart as an OCI artifact
#   install: helm install hermit oci://$REGISTRY/charts/hermit --version <chart-version>
#
# Both chart version and appVersion are taken from the tag (via helm flags):
#   - chart-vA.B.C : chart-only release @ A.B.C
#   - vX.Y.Z       : app release also republishes the chart @ X.Y.Z
# ---------------------------------------------------------------------------
helm-chart:
  stage: chart
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    - |
      set -eu
      # The git tag is the source of truth for both chart and app version.
      case "$CI_COMMIT_TAG" in
        chart-v*) VER="${CI_COMMIT_TAG#chart-v}" ;;   # chart-only release
        v*)       VER="${CI_COMMIT_TAG#v}" ;;         # app release republishes the chart
      esac
      helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
      helm package charts/hermit --version "$VER" --app-version "$VER" --destination /tmp
      helm push "/tmp/hermit-${VER}.tgz" "oci://${CI_REGISTRY_IMAGE}/charts"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_TAG =~ /^chart-v\d+\.\d+\.\d+$/'

# Hermit CI/CD — the canonical pipeline (GitLab is the source of truth).
#
# Stages:
#   test    — fmt / clippy / unit tests, plus the per-crate 80% coverage gate.
#   build   — the server container image, built rootless with kaniko.
#   release — a GitLab Release object with git-cliff-generated notes.
#   chart   — the official Helm chart, pushed as an OCI artifact.
#
# The git tag is the single source of truth for the version: CI stamps it into
# the crate (Cargo.toml) and the chart (helm --version/--app-version) at build
# time, so there are no version files to keep in sync. To release, run the
# manual `create-release` job on main and pick a bump (patch/minor/major) — CI
# computes the next tag from the latest one and pushes it, which triggers this
# pipeline. Nobody hand-creates tags or edits versions. The committed
# Cargo.toml/Chart.yaml versions are dev placeholders that CI overrides.
#
# Tag scheme (see brain/plans/PLAN_RELEASE_STRATEGY.md):
#   vX.Y.Z        → image :X.Y.Z + :latest, GitLab Release, chart @ X.Y.Z
#   vX.Y.Z-rc.N   → image :X.Y.Z-rc.N only (never :latest, no release, no chart)
#   chart-vA.B.C  → chart only @ A.B.C
#   main push     → image :main-<shortsha> for homelab testing between releases
#
# Portability: release logic is intentionally plain shell so a future move to
# GitHub Actions / Docker Hub is a matter of re-wiring triggers, not rewriting.
stages: [test, build, release, chart]

# ---------------------------------------------------------------------------
# create-release — manual, main only. CI owns tag creation: pick a bump level
# when you run it and it computes the next vX.Y.Z from the latest tag and pushes
# it. That tag push triggers the build + chart pipeline. No hand-made tags.
# Requires a CI/CD variable RELEASE_TOKEN — a project access token with the
# write_repository scope, allowed to create the protected v* tags.
# ---------------------------------------------------------------------------
create-release:
  stage: .pre
  image: alpine/git:latest
  variables:
    BUMP: patch          # override to "minor" or "major" when you run the job
    GIT_DEPTH: "0"       # need full tag history to find the latest version
  script:
    - |
      set -eu
      git fetch --tags --quiet
      # `sed -n 1p` reads the whole stream (unlike `head -1`, which closes the pipe
      # early and SIGPIPEs git/grep → exit 141). `|| true` covers the no-tags-yet case.
      LATEST=$(git tag -l --sort=-v:refname 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)
      LATEST="${LATEST:-v0.0.0}"; V="${LATEST#v}"
      MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST##*.}"
      case "$BUMP" in
        major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
        minor) MINOR=$((MINOR+1)); PATCH=0 ;;
        patch) PATCH=$((PATCH+1)) ;;
        *) echo "BUMP must be patch, minor, or major (got '$BUMP')" >&2; exit 1 ;;
      esac
      NEW="v${MAJOR}.${MINOR}.${PATCH}"
      echo "Latest tag ${LATEST} + ${BUMP} -> ${NEW}"
      # Annotated tags need a tagger identity, which a fresh CI clone lacks.
      git config user.email "ci@mangoleafstudios.com"
      git config user.name "GitLab CI"
      git tag -a "$NEW" -m "release $NEW"
      git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "$NEW"
      echo "Pushed ${NEW} — the tag pipeline will build the image and publish the chart."
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# sccache — compile cache backed by Garage S3, replacing GitLab's cache: (which
# zipped target/ + .cargo into one archive and timed out uploading to Garage).
# sccache stores each object directly over S3 instead. Creds come from Vault;
# the rust jobs install the sccache binary and point RUSTC_WRAPPER at it. Reuses
# the same bucket / Vault role / secret as the rest workspace — no new infra.
# ---------------------------------------------------------------------------
sccache-creds:
  stage: .pre
  image: alpine:3
  variables:
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    SCCACHE_VAULT_PATH: "secret/data/gitlab/sccache"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      VAULT_TOKEN="$(curl -sf --request POST --data "{\"role\":\"gitlab-ci\",\"jwt\":\"$JWT\"}" "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')"
      SECRET="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$SCCACHE_VAULT_PATH")"
      echo "SCCACHE_ACCESS_KEY=$(echo "$SECRET" | jq -r '.data.data.accesskey')" >> sccache.env
      echo "SCCACHE_SECRET_KEY=$(echo "$SECRET" | jq -r '.data.data.secretkey')" >> sccache.env
  artifacts:
    reports:
      dotenv: sccache.env

# SCCACHE_* env + the optional dep on the creds job. Rust jobs `extends` this.
.sccache:
  variables:
    SCCACHE_VERSION: "0.16.0"
    SCCACHE_BUCKET: gitlab-sccache
    SCCACHE_REGION: garage
    SCCACHE_ENDPOINT: http://garage.garage.svc.cluster.local:3900
    SCCACHE_S3_USE_SSL: "false"
  needs:
    - job: sccache-creds
      optional: true

# Install the sccache binary and enable it when Vault creds are present.
# !reference'd as the first step of each rust job's before_script.
.sccache-setup:
  script:
    - |
      curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
        | tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/sccache'
      chmod +x /usr/local/bin/sccache
      if [ -n "${SCCACHE_ACCESS_KEY:-}" ]; then
        export RUSTC_WRAPPER=sccache
        export AWS_ACCESS_KEY_ID="$SCCACHE_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SCCACHE_SECRET_KEY"
        echo ">>> sccache ON -> $SCCACHE_ENDPOINT/$SCCACHE_BUCKET"
      else
        echo ">>> sccache OFF (no creds — compiling uncached)"
      fi

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
lint:
  stage: test
  image: rust:1.97.0-bookworm
  extends: .sccache
  variables:
    CARGO_TERM_COLOR: always
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - !reference [.sccache-setup, script]
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --workspace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'

# Per-crate 80% line-coverage gate. Gate EACH crate independently: a merged
# `-p a -p b --fail-under-lines` check lets a sub-80% crate hide behind a
# stronger sibling. Line coverage only (branch needs nightly; we pin stable).
# Runs on MRs and main — a tag is cut from an already-green main, so it is not
# re-gated on the release pipeline.
coverage:
  stage: test
  image: rust:1.97.0-bookworm
  extends: .sccache
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - !reference [.sccache-setup, script]
    - rustup component add llvm-tools-preview
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall -y cargo-llvm-cov cargo-nextest
  script:
    - |
      set -euo pipefail
      fail=0
      while read -r crate; do
        [ -z "$crate" ] && continue
        case "$crate" in \#*) continue ;; esac
        echo "── coverage: $crate ──"
        cargo llvm-cov nextest -p "$crate" --fail-under-lines 80 --summary-only || fail=1
      done < .port/gated-crates.txt
      exit $fail
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# build — server image (kaniko, no Docker daemon: the homelab runner is in k3s)
# ---------------------------------------------------------------------------
docker-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE: $CI_REGISTRY_IMAGE
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_COMMIT_TAG#v}"
        BASE="${TAG%-rc.*}"                    # strip any -rc.N for the :latest decision
        # The git tag is the source of truth: stamp it into the workspace version
        # (first `version = ` line only) so the built binary reports the release.
        sed -i "0,/^version = /s/^version = \".*\"/version = \"$TAG\"/" Cargo.toml
        if [ "$TAG" = "$BASE" ]; then
          DESTS="--destination $IMAGE:$TAG --destination $IMAGE:latest"   # final release
        else
          DESTS="--destination $IMAGE:$TAG"                              # -rc.N: no :latest
        fi
      else
        DESTS="--destination $IMAGE:main-$CI_COMMIT_SHORT_SHA"
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      $DESTS
      --push-retry 5
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# release — GitLab Release with git-cliff notes (final versions only)
# ---------------------------------------------------------------------------
release-notes:
  stage: release
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0                               # git-cliff needs full history + tags
  script:
    - git-cliff --current --strip header -o release_notes.md
    - cat release_notes.md
  artifacts:
    paths: [release_notes.md]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-notes]
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Hermit $CI_COMMIT_TAG"
    description: release_notes.md
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ---------------------------------------------------------------------------
# chart — official Helm chart as an OCI artifact
#   install: helm install hermit oci://$REGISTRY/charts/hermit --version <chart-version>
#
# Both chart version and appVersion are taken from the tag (via helm flags):
#   - chart-vA.B.C : chart-only release @ A.B.C
#   - vX.Y.Z       : app release also republishes the chart @ X.Y.Z
# ---------------------------------------------------------------------------
helm-chart:
  stage: chart
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    - |
      set -eu
      # The git tag is the source of truth for both chart and app version.
      case "$CI_COMMIT_TAG" in
        chart-v*) VER="${CI_COMMIT_TAG#chart-v}" ;;   # chart-only release
        v*)       VER="${CI_COMMIT_TAG#v}" ;;         # app release republishes the chart
      esac
      helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
      helm package charts/hermit --version "$VER" --app-version "$VER" --destination /tmp
      helm push "/tmp/hermit-${VER}.tgz" "oci://${CI_REGISTRY_IMAGE}/charts"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_TAG =~ /^chart-v\d+\.\d+\.\d+$/'

# Build & push the hermit-server image to the GitLab registry.
#
# Versioning: annotated git tags `vMAJOR.MINOR.PATCH` (starting at v0.1.0) are the
# release trigger. A tag pushes `:MAJOR.MINOR.PATCH` + `:latest`; pushes to the
# default branch publish `:main-<shortsha>` for homelab testing between releases.
#
# Built with kaniko, not docker build: the homelab runner is in k3s with no
# Docker daemon (docker:dind can't reach a socket → "Cannot connect to the
# Docker daemon"). kaniko builds the Dockerfile rootless, no daemon needed.
stages: [release]

docker-image:
  stage: release
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/hermit-server
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    # On a version tag, the tag must match the workspace Cargo.toml version.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_COMMIT_TAG#v}"
        CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        if [ "$TAG" != "$CARGO_VERSION" ]; then
          echo "tag v$TAG != workspace Cargo.toml version $CARGO_VERSION" >&2; exit 1
        fi
        DESTS="--destination $IMAGE:$TAG --destination $IMAGE:latest"
      else
        DESTS="--destination $IMAGE:main-$CI_COMMIT_SHORT_SHA"
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      $DESTS
      --push-retry 5
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Package the official Helm chart and push it to the GitLab OCI registry alongside the
# image. Consumers install with: helm install hermit oci://$REGISTRY/charts/hermit --version X.
# Tag-only: the chart is released in lockstep with the app, and its version must match the tag.
helm-chart:
  stage: release
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    - TAG="${CI_COMMIT_TAG#v}"
    - CHART_VERSION=$(sed -n 's/^version: *\(.*\)/\1/p' charts/hermit/Chart.yaml | head -1)
    - |
      if [ "$TAG" != "$CHART_VERSION" ]; then
        echo "tag v$TAG != charts/hermit Chart.yaml version $CHART_VERSION" >&2; exit 1
      fi
    - helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - helm package charts/hermit --destination /tmp
    - helm push "/tmp/hermit-${CHART_VERSION}.tgz" "oci://${CI_REGISTRY_IMAGE}/charts"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

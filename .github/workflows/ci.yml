name: CI

on:
  push:
    # release/** too: its push run writes the sccache entries that PRs into the branch
    # read (GitHub lets a PR read its base branch's caches, never a sibling PR's). The
    # price is a second run of every job while a release->main PR is open.
    branches: [main, "release/**"]
  pull_request:

permissions: {} # each job grants only what it needs

# A new push to a PR replaces its still-running CI. A push run (main) gets a group
# of its own, so it is never cancelled, nor dropped while queued behind another
# (GitHub replaces a pending run in a shared group even without cancel-in-progress):
# two quick merges must each report their own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debuginfo is useless in CI (nothing is debugged interactively) and only
  # inflates target/ and the rust-cache entries.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  benchmark-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Reporter correctness only: no containers, media fixture or timing gate.
      - run: python3 -m unittest discover -s bench -p test_report.py

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No disk freeing: the build fits the runner's free disk without it. The
      # df/du steps record the margin, so a future overflow shows in the log.
      - name: disk at start
        run: df -h /
      # NOTE: the benchmark/parity suite (v2) and its CI gates were retired on
      # 2026-09-02 by owner decision. Suite v3 (bench/) deliberately does NOT run here:
      # it needs a quiet machine, pinned cores and ~17 GB of generated test data, and a
      # number measured on a shared runner would be worse than no number. It runs
      # before each release — see RELEASE.md.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.98.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.98.1 # = rust-toolchain.toml
          components: rustfmt, clippy
          # Builds the WASM example guest for the end-to-end plugin-host test.
          targets: wasm32-wasip2
      # Before rust-cache and install-action, so `sccache` is on PATH for any cargo they run.
      # The version matches GitLab's SCCACHE_VERSION. rust-cache (kept, D5) restores the
      # registry and compiled dependencies; sccache serves the workspace crates it discards.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Pin a release tag (on install-action's main), never a per-tool tag such as
      # @nextest: those commits sit off main and are orphaned when the tag moves,
      # which zizmor reports as an impostor commit.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
        # FERROFIN_WASM_GUEST_TESTS=1 builds+runs the real wasm-hello guest so
        # the ferrofin:plugin WIT contract can't drift silently. nextest runs the
        # binaries in parallel, each test in its own process (the gate CLAUDE.md
        # names); no CI job runs plain `cargo test`'s threads-in-one-process model.
      - run: FERROFIN_WASM_GUEST_TESTS=1 cargo nextest run --workspace
      - run: cargo test --workspace --doc # nextest cannot run doctests
      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
      - name: disk at end
        if: always()
        run: |
          df -h /
          du -sh target || true # absent when the job failed before building


  shell-tests:
    # The shell tooling has its own tests: scripts/version.sh (release versioning),
    # adoption/ (the Jellyfin-adoption harness — its checks are driven with canned logs and
    # throwaway SQLite files; the real fixtures never run here) and verify/ (the live
    # scan-behaviour check — its logic is driven with canned /metrics text, its refusals
    # against a python3 static file server, and whole runs against verify/tests/fake_server.py,
    # which plays back a scripted server's scans).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0   # version.bats reads tags
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats shellcheck sqlite3 jq curl python3-pil python3-yaml
      - run: shellcheck -x scripts/version.sh scripts/ci-config-check.sh scripts/coverage-gate.sh adoption/lib.sh adoption/run.sh adoption/smoke.sh adoption/build-fixtures.sh verify/lib.sh verify/scan-behaviour.sh
      - run: shellcheck -x -s bash scripts/tests/version.bats scripts/tests/ci-config-check.bats scripts/tests/coverage-gate.bats adoption/tests/adoption.bats verify/tests/verify.bats
      - run: bats scripts/tests adoption/tests verify/tests
      - run: scripts/ci-config-check.sh check

  # The 80% per-crate gate (scripts/coverage-gate.sh) runs as three parallel shards;
  # the aggregate `coverage` job below is the one status check main's branch protection
  # requires (matrix jobs report as `coverage-shard (core)` etc., never as `coverage`).
  coverage-shard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false # one failing shard must not hide another's result
      matrix:
        shard: [core, heavy, rest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No disk freeing: the build fits the runner's free disk without it. The
      # df/du steps record the margin, so a future overflow shows in the log.
      - name: disk at start
        run: df -h /
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.98.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.98.1 # = rust-toolchain.toml
          components: llvm-tools-preview
      # Before rust-cache and install-action, so `sccache` is on PATH for any cargo they run.
      # The version matches GitLab's SCCACHE_VERSION. rust-cache (kept, D5) restores the
      # registry and compiled dependencies; sccache serves the workspace crates it discards.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.shard }} # a cache entry per shard, so they do not overwrite one another
      # Same release-tag pin as lint (see the note there): never a per-tool tag.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,nextest
      # ffmpeg is only needed by the env-gated integration tests; unit/parity tests avoid it.
      - name: coverage gate (per crate)
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/coverage-gate.sh "$SHARD"
      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
      - name: disk at end
        if: always()
        run: |
          df -h /
          du -sh target || true # absent when the job failed before building

  coverage:
    needs: coverage-shard
    if: always() # a failed or cancelled shard must fail this check, not leave it skipped
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: all coverage shards passed
        env:
          RESULT: ${{ needs.coverage-shard.result }}
        run: |
          echo "coverage-shard: $RESULT"
          [ "$RESULT" = success ]

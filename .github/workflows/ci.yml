name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # 80% line-coverage gate. Applied per-ported-crate via the allowlist until
      # every crate is ported, then flip to `--workspace`. See brain/PLAN_HERMIT_PORT.md.
      # ffmpeg is only needed by integration tests in later waves; unit/parity tests avoid it.
      - name: coverage gate (ported crates)
        shell: bash
        run: |
          set -euo pipefail
          # Gate EACH crate independently: `-p a -p b --fail-under-lines` checks the
          # MERGED total, which lets a sub-80% crate hide behind a stronger sibling.
          # Line coverage only — branch coverage (-Z coverage-options=branch) is nightly-only; we pin stable.
          fail=0
          while read -r crate; do
            [ -z "$crate" ] && continue
            case "$crate" in \#*) continue ;; esac
            echo "── coverage: $crate ──"
            cargo llvm-cov nextest -p "$crate" --fail-under-lines 80 --summary-only || fail=1
          done < .port/gated-crates.txt
          exit $fail

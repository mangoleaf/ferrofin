name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {} # each job grants only what it needs

# A new push to a PR replaces its still-running CI. A push run (main) gets a group
# of its own, so it is never cancelled, nor dropped while queued behind another
# (GitHub replaces a pending run in a shared group even without cancel-in-progress):
# two quick merges must each report their own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debug builds of this 20-crate workspace overflow the runner's ~14 GB free
  # disk; debuginfo is useless in CI (nothing is debugged interactively).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: free runner disk (~25 GB of preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # NOTE: the benchmark/parity suite (v2) and its CI gates were retired on
      # 2026-09-02 by owner decision. Suite v3 (bench/) deliberately does NOT run here:
      # it needs a quiet machine, pinned cores and ~17 GB of generated test data, and a
      # number measured on a shared runner would be worse than no number. It runs
      # before each release — see RELEASE.md.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.98.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.98.1 # = rust-toolchain.toml
          components: rustfmt, clippy
          # Builds the WASM example guest for the end-to-end plugin-host test.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
        # FERROFIN_WASM_GUEST_TESTS=1 builds+runs the real wasm-hello guest so
        # the ferrofin:plugin WIT contract can't drift silently.
      - run: FERROFIN_WASM_GUEST_TESTS=1 cargo test --workspace


  shell-tests:
    # The shell tooling has its own tests: scripts/version.sh (release versioning),
    # adoption/ (the Jellyfin-adoption harness — its checks are driven with canned logs and
    # throwaway SQLite files; the real fixtures never run here) and verify/ (the live
    # scan-behaviour check — its logic is driven with canned /metrics text, its refusals
    # against a python3 static file server, and whole runs against verify/tests/fake_server.py,
    # which plays back a scripted server's scans).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0   # version.bats reads tags
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats shellcheck sqlite3 jq curl python3-pil python3-yaml
      - run: shellcheck -x scripts/version.sh scripts/ci-config-check.sh scripts/coverage-gate.sh adoption/lib.sh adoption/run.sh adoption/smoke.sh adoption/build-fixtures.sh verify/lib.sh verify/scan-behaviour.sh
      - run: shellcheck -x -s bash scripts/tests/version.bats scripts/tests/ci-config-check.bats scripts/tests/coverage-gate.bats adoption/tests/adoption.bats verify/tests/verify.bats
      - run: bats scripts/tests adoption/tests verify/tests
      - run: scripts/ci-config-check.sh check

  # The 80% per-crate gate (scripts/coverage-gate.sh) runs as three parallel shards;
  # the aggregate `coverage` job below is the one status check main's branch protection
  # requires (matrix jobs report as `coverage-shard (core)` etc., never as `coverage`).
  coverage-shard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false # one failing shard must not hide another's result
      matrix:
        shard: [core, heavy, rest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: free runner disk (~25 GB of preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.98.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.98.1 # = rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.shard }} # a cache entry per shard, so they do not overwrite one another
      - uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # cargo-llvm-cov
      - uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1 # nextest
      # ffmpeg is only needed by the env-gated integration tests; unit/parity tests avoid it.
      - name: coverage gate (per crate)
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/coverage-gate.sh "$SHARD"

  coverage:
    needs: coverage-shard
    if: always() # a failed or cancelled shard must fail this check, not leave it skipped
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: all coverage shards passed
        env:
          RESULT: ${{ needs.coverage-shard.result }}
        run: |
          echo "coverage-shard: $RESULT"
          [ "$RESULT" = success ]

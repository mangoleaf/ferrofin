name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debug builds of this 20-crate workspace overflow the runner's ~14 GB free
  # disk; debuginfo is useless in CI (nothing is debugged interactively).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: free runner disk (~25 GB of preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # NOTE: the benchmark/parity suite (v2) and its CI gates were retired on
      # 2026-09-02 by owner decision. Suite v3 (bench/) deliberately does NOT run here:
      # it needs a quiet machine, pinned cores and ~17 GB of generated test data, and a
      # number measured on a shared runner would be worse than no number. Contributors
      # run it themselves — see CONTRIBUTING.md.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          # Builds the WASM example guest for the end-to-end plugin-host test.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
        # FERROFIN_WASM_GUEST_TESTS=1 builds+runs the real wasm-hello guest so
        # the ferrofin:plugin WIT contract can't drift silently.
      - run: FERROFIN_WASM_GUEST_TESTS=1 cargo test --workspace


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: free runner disk (~25 GB of preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # 80% line-coverage gate, enforced per-crate over every crate in crates/.
      # ffmpeg is only needed by the env-gated integration tests; unit/parity tests avoid it.
      - name: coverage gate (per crate)
        shell: bash
        run: |
          set -euo pipefail
          # Gate EACH crate independently: `-p a -p b --fail-under-lines` checks the
          # MERGED total, which lets a sub-80% crate hide behind a stronger sibling.
          # Line coverage only — branch coverage (-Z coverage-options=branch) is nightly-only; we pin stable.
          # ferrofin-traits is exempt (trait definitions; the bodies live in ferrofin-core —
          # see CLAUDE.md), as is apps/ferrofin-server (the composition root).
          fail=0
          for dir in crates/*/; do
            crate=$(basename "$dir")
            [ "$crate" = ferrofin-traits ] && continue
            echo "── coverage: $crate ──"
            # `-p X` still instruments X's workspace deps, so their (uncovered) source
            # lands in the TOTAL the gate compares against. Exclude every sibling.
            others=$(basename -a crates/*/ | grep -v "^$crate\$" | paste -sd'|')
            cargo llvm-cov nextest -p "$crate" --fail-under-lines 80 --summary-only \
              --ignore-filename-regex "(crates/($others)|apps)/" || fail=1
          done
          exit $fail

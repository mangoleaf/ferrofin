name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # Best-effort perf gate (plans 04/08): non-blocking (`continue-on-error`)
  # because shared runners are noisy — the MANDATORY gate is the local
  # `cd benchmark && ./perf-gate.sh` documented in CLAUDE.md. Fairness rule:
  # a latency baseline is only comparable when measured in the SAME
  # environment, so this job never uses the repo's committed baseline (that
  # one belongs to the dev host). Instead it is self-contained: it captures a
  # baseline from the PR's merge-base tree on this very runner, then gates the
  # PR tree against it. Skips loudly (still green) on non-perf paths.
  perf-gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: skip unless perf-relevant paths changed
        id: paths
        shell: bash
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          if git diff --name-only "$base" HEAD | grep -qE \
            '^(crates/hermit-(core|db|api)/|suite/)'; then
            echo "relevant=1" >> "$GITHUB_OUTPUT"
          else
            echo "perf-gate: no perf-relevant paths touched — skipping"
            echo "relevant=0" >> "$GITHUB_OUTPUT"
          fi
      - name: install k6 + ffmpeg
        if: steps.paths.outputs.relevant == '1'
        run: |
          sudo gpg -k && sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y -qq k6 ffmpeg jq
      - name: baseline from merge-base, then gate the PR tree
        if: steps.paths.outputs.relevant == '1'
        shell: bash
        run: |
          set -euo pipefail
          # Perf leg dir: suite/perf today; the merge-base tree may predate the consolidation.
          legdir() { if [ -d "$1/suite/perf" ]; then echo "$1/suite/perf"; else echo "$1/benchmark"; fi; }
          # Synthetic-only fixture env, identical for both legs.
          mk_env() { printf 'JELLYFIN_IMAGE=jellyfin/jellyfin:10.11.8\nBENCH_CPUS=2\nBENCH_MEM=3g\nREAL_MEDIA_DIR=\nREAL_TV_DIR=\nFIXTURE_MOVIES=300\nFIXTURE_SERIES=0\nFIXTURE_EPISODES_PER_SERIES=10\nBENCH_VUS=50\nBENCH_DURATION=30s\nBENCH_WARMUP_SECONDS=10\nBENCH_ADMIN_USER=bench\nBENCH_ADMIN_PASSWORD=benchpass123\nRUN_TRANSCODE=0\n' > "$(legdir "$1")/.env"; }
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git worktree add /tmp/base-tree "$base"
          mk_env /tmp/base-tree
          # Reuse the PR tree's generated fixtures for both legs (identical library).
          (cd "$(legdir /tmp/base-tree)" && ln -sfn "$GITHUB_WORKSPACE/suite/perf/fixtures" fixtures || true)
          (cd "$(legdir /tmp/base-tree)" && ./perf-gate.sh --rebaseline)
          mk_env "$GITHUB_WORKSPACE"
          cp /tmp/base-tree/suite/perf-baseline.json suite/perf-baseline.json
          (cd suite/perf && ./perf-gate.sh)

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # 80% line-coverage gate. Applied per-ported-crate via the allowlist until
      # every crate is ported, then flip to `--workspace`. See brain/PLAN_HERMIT_PORT.md.
      # ffmpeg is only needed by integration tests in later waves; unit/parity tests avoid it.
      - name: coverage gate (ported crates)
        shell: bash
        run: |
          set -euo pipefail
          # Gate EACH crate independently: `-p a -p b --fail-under-lines` checks the
          # MERGED total, which lets a sub-80% crate hide behind a stronger sibling.
          # Line coverage only — branch coverage (-Z coverage-options=branch) is nightly-only; we pin stable.
          fail=0
          while read -r crate; do
            [ -z "$crate" ] && continue
            case "$crate" in \#*) continue ;; esac
            echo "── coverage: $crate ──"
            # `-p X` still instruments X's workspace deps, so their (uncovered) source
            # lands in the TOTAL the gate compares against. Exclude every sibling.
            others=$(ls crates | grep -v "^$crate\$" | paste -sd'|')
            cargo llvm-cov nextest -p "$crate" --fail-under-lines 80 --summary-only \
              --ignore-filename-regex "(crates/($others)|apps)/" || fail=1
          done < .port/gated-crates.txt
          exit $fail

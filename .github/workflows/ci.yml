name: CI

on:
  push:
    # release/** too: its push run writes the caches that PRs into the branch read
    # (GitHub lets a PR read its base branch's caches, never a sibling PR's). That push
    # run is also the release PR's check: the release PR's own run skips every job (see
    # benchmark-report), so no release commit runs CI twice.
    branches: [main, "release/**"]
  pull_request:

permissions: {} # each job grants only what it needs

# A new push to a PR replaces its still-running CI. A push run (main) gets a group
# of its own, so it is never cancelled, nor dropped while queued behind another
# (GitHub replaces a pending run in a shared group even without cancel-in-progress):
# two quick merges must each report their own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debuginfo is useless in CI (nothing is debugged interactively) and only
  # inflates target/ and the rust-cache entries. Cargo.toml's [profile.dev] already
  # leaves dependencies without it; this also drops the workspace's line tables.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Only push runs write caches (with rust-cache's save-if): PR runs read them, so the
  # 10 GB cache quota holds the base branches' entries that every PR reads instead of
  # per-PR copies of the same build.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  benchmark-report:
    # Every job is skipped in the release PR's run (a release/* head in this repository,
    # into main): the push run on the same commit is its check, and main's strict branch
    # protection means that commit is exactly what merges. Every job below repeats this
    # condition.
    if: &not-release-pr ${{ !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Reporter correctness only: no containers, media fixture or timing gate.
      - run: python3 -m unittest discover -s gates/bench -p test_report.py
      - run: python3 -m unittest discover -s gates/bench -p test_ramp.py
      - run: python3 -m unittest discover -s gates/bench -p test_soak.py
      - run: python3 -m unittest discover -s gates/bench -p test_endpoints.py
      - run: python3 -m unittest discover -s gates/bench -p test_viewer.py
      # The README Results block and its graphs must be what the committed summary files give
      # (gates/README.md, "Publishing the results"): a re-render, no gate and no benchmark.
      - run: python3 gates/publish.py readme --check

  # fmt and clippy. The workspace tests run beside it in lint-tests; the aggregate `lint`
  # job below is the status check main's branch protection requires.
  clippy:
    if: *not-release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No disk freeing: the build fits the runner's free disk without it. The
      # df/du steps record the margin, so a future overflow shows in the log.
      - name: disk at start
        run: df -h /
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.99.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          components: rustfmt, clippy
      # rust-cache hashes every installed toolchain into its key, so the runner image's own
      # stable Rust would change every key (a cold cache) each time a new image ships.
      - run: rustup toolchain uninstall stable
      # Before rust-cache, so `sccache` is on PATH for any cargo it runs. The version
      # matches GitLab's SCCACHE_VERSION. rust-cache (kept, D5) restores the registry and
      # compiled dependencies; sccache serves the workspace crates it discards.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          save-if: ${{ github.event_name == 'push' }} # PR runs only read (see SCCACHE_GHA_RW_MODE)
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
      - name: disk at end
        if: always()
        run: |
          df -h /
          du -sh target || true # absent when the job failed before building

  # Every workspace test once, split three ways by nextest's hash partitioning, plus the
  # doctests in partition 1.
  lint-tests:
    if: *not-release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false # one failing partition must not hide another's result
      matrix:
        partition: [1, 2, 3] # the nextest step's "/3" is this list's length
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # ubuntu-latest hands out two disks: most runners start with ~86 GB free, some
      # with ~17 GB (a 72 GB disk). A lint-tests partition grows target to ~33 GB and
      # the core coverage shard to ~19 GB, so on a small runner the preinstalled SDKs
      # these jobs never use are deleted first. The df/du steps record the margin.
      # coverage-shard reuses this step (*disk-at-start).
      - &disk-at-start
        name: disk at start
        env:
          MIN_FREE_GB: 40 # the largest job's target (lint-tests, ~33 GB) plus headroom
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt "$MIN_FREE_GB" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /usr/share/swift /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      # NOTE: the benchmark/parity suite (v2) and its CI gates were retired on
      # 2026-09-02 by owner decision. Suite v3 (gates/bench/) deliberately does NOT run here:
      # it needs a quiet machine, pinned cores and ~17 GB of generated test data, and a
      # number measured on a shared runner would be worse than no number. It runs
      # before each release — see RELEASE.md.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # Same master-commit pin as clippy (see the note there).
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          # Builds the WASM example guest for the end-to-end plugin-host test.
          targets: wasm32-wasip2
      - run: rustup toolchain uninstall stable # keeps rust-cache's key stable (see clippy)
      # Before rust-cache and install-action, so `sccache` is on PATH for any cargo they run.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          version: v0.16.0
      # No per-partition key: the three partitions build the same thing, so they share one entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          save-if: ${{ github.event_name == 'push' }} # PR runs only read (see SCCACHE_GHA_RW_MODE)
      # Pin a release tag (on install-action's main), never a per-tool tag such as
      # @nextest: those commits sit off main and are orphaned when the tag moves,
      # which zizmor reports as an impostor commit.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # FERROFIN_WASM_GUEST_TESTS=1 builds+runs the real wasm-hello guest so the
      # ferrofin:plugin WIT contract can't drift silently, in whichever partition it
      # hashes to. nextest runs the binaries in parallel, each test in its own process
      # (the gate CLAUDE.md names); no CI job runs plain `cargo test`'s
      # threads-in-one-process model.
      - env:
          PARTITION: ${{ matrix.partition }}
        run: FERROFIN_WASM_GUEST_TESTS=1 cargo nextest run --locked --workspace --partition "hash:$PARTITION/3"
      - if: matrix.partition == 1
        run: cargo test --locked --workspace --doc # nextest cannot run doctests
      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
      - name: disk at end
        if: always()
        run: |
          df -h /
          du -sh target || true # absent when the job failed before building

  # The supply chain, without a build: cargo-deny checks the crates the workspace and the
  # wasm-hello guest build against the RustSec advisory database (yanked versions included) and
  # deny.toml's license, ban and source rules, cargo-machete looks for declared but unused
  # dependencies, and check-workspace-deps.py for a dependency a crate declares itself instead
  # of taking the workspace's. Outside `lint`, so an advisory published today turns every branch
  # red without blocking merges; it does block a release, which needs this whole run green and
  # re-checks the advisories before tagging (release.yml).
  dependencies:
    if: *not-release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # cargo-deny reads the crate graph through `cargo metadata`. Same master-commit pin
      # as clippy (see the note there).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
      # Same release-tag pin as lint-tests (see the note there): never a per-tool tag.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      # Each check runs whatever the one before found, so an advisory never hides the rest.
      - run: cargo deny --locked check
      # The wasm-hello guest is outside the workspace, with its own Cargo.lock. Run from the root, so the
      # root's deny.toml applies (cargo-deny reads its config from the directory it starts in).
      - if: ${{ !cancelled() }}
        run: cargo deny --manifest-path examples/wasm-hello/Cargo.toml --locked check
      - if: ${{ !cancelled() }}
        run: cargo machete apps crates # vendor/ holds upstream code as published
      - if: ${{ !cancelled() }}
        run: scripts/check-workspace-deps.py

  # cargo-vet: every crate in Cargo.lock needs an audit (gates/supply-chain/audits.toml, or one
  # imported from the organisations gates/supply-chain/config.toml names) or an exemption there, so
  # a PR that adds an unaudited crate, or moves one to an unaudited version, fails here naming it
  # (CONTRIBUTING.md, "Dependencies"). Its result changes only with the branch, never with the date
  # (--locked reads the committed gates/supply-chain/imports.lock instead of fetching the imports),
  # so unlike `dependencies` it is part of `lint` and blocks merging.
  vet:
    if: *not-release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # cargo-vet reads the crate graph through `cargo metadata`. Same master-commit pin
      # as clippy (see the note there).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
      # Built from crates.io, as ci/Dockerfile does for GitLab: the install-action release pinned
      # above predates cargo-vet 0.10.3, and its fallback would fetch a binary it holds no hash for.
      - run: cargo install --locked cargo-vet@0.10.3
      - run: cargo vet --locked

  lint:
    # Renamed as well as skipped in the release PR's run (see benchmark-report): a skipped
    # check named `lint` on the commit could pass for the push run's failed one.
    name: ${{ (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main') && 'lint (release PR, checked by its push run)' || 'lint' }}
    needs: [clippy, lint-tests, vet]
    # always(): a failed or cancelled job must fail this check, not leave it skipped
    if: ${{ always() && !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: clippy, every test partition and cargo vet passed
        env:
          CLIPPY: ${{ needs.clippy.result }}
          TESTS: ${{ needs.lint-tests.result }}
          VET: ${{ needs.vet.result }}
        run: |
          echo "clippy: $CLIPPY, lint-tests: $TESTS, vet: $VET"
          [ "$CLIPPY" = success ] && [ "$TESTS" = success ] && [ "$VET" = success ]

  shell-tests:
    if: *not-release-pr
    # The shell tooling has its own tests: scripts/version.sh (release versioning), gates/lib.sh (the
    # gates' output root, and how each gate's script takes its directories from it), gates/run (the
    # one entry point: its preflight and session folder, against fake gates and a fake docker),
    # gates/adoption/ (the Jellyfin-adoption harness — its checks are driven with canned logs and
    # throwaway SQLite files; the real fixtures never run here), gates/verify/ (the live
    # scan-behaviour check — its logic is driven with canned /metrics text, its refusals
    # against a python3 static file server, and whole runs against gates/verify/tests/fake_server.py,
    # which plays back a scripted server's scans), gates/parity/ (the live parity replay — its runner is
    # driven against a fake docker and fake servers, its comparison with fixture response pairs),
    # gates/roundtrip/ (the round trip back to Jellyfin — its runner against a fake docker, its log
    # checks with canned Jellyfin logs, its usage stage against a stub server), every
    # gate's Python tests (gates/bench's again, beside benchmark-report) and scripts/ci-timings.py (CI
    # time medians — its log parsing is driven with canned job logs). The gates' part is one list, the
    # Makefile's test-gates-offline target.
    runs-on: ubuntu-latest
    # About 5 minutes normally (4.5 to 5.0 over 20 runs, 2026-10-25). A hung test once held it for 24
    # minutes (gl-920); without a limit a hang would run to GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0   # version.bats reads tags
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats shellcheck sqlite3 jq curl python3-pil python3-icu python3-yaml
      - run: pip install git-cliff==2.14.2   # = mise.toml and release.yml; git-cliff.bats runs it
      - run: shellcheck -x scripts/version.sh scripts/ci-config-check.sh scripts/coverage-gate.sh
      - run: shellcheck -x -s bash scripts/tests/version.bats scripts/tests/ci-config-check.bats scripts/tests/coverage-gate.bats scripts/tests/git-cliff.bats
      - run: bats scripts/tests
      - run: make test-gates-offline   # the gates' own shellcheck, bats and Python tests: one list, in the Makefile
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: scripts/ci-config-check.sh check

  # The Helm chart, linted and rendered. release.yml only runs `helm package`, which renders no
  # template, so a template error would first show on a user's `helm install` of the published
  # chart (gl-148). The first lint renders the defaults (the chart-created PVC among them), the
  # second the example values with every optional template file switched on. Lint checks rendering,
  # not the Kubernetes schema. The helm is the runner image's, unpinned, so an image update can
  # turn --strict red with no commit: hence outside `lint`, like `dependencies`. It blocks a
  # release, not a merge.
  chart:
    if: *not-release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: helm version # the runner image's, which release.yml's helm-chart job packages with
      - run: helm lint --strict charts/ferrofin
      - run: >-
          helm lint --strict charts/ferrofin -f charts/ferrofin/values.example.yaml
          --set ingress.enabled=true,httpRoute.enabled=true,discovery.enabled=true,networkPolicy.enabled=true
          --set metrics.enabled=true,metrics.serviceMonitor.enabled=true,dashboards.enabled=true

  # The 80% per-crate gate (scripts/coverage-gate.sh) runs as three parallel shards;
  # the aggregate `coverage` job below is the one status check main's branch protection
  # requires (matrix jobs report as `coverage-shard (core)` etc., never as `coverage`).
  coverage-shard:
    if: *not-release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false # one failing shard must not hide another's result
      matrix:
        shard: [core, heavy, rest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - *disk-at-start # frees disk on a small runner (see lint-tests)
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        # A master commit, deliberately without a ref comment: dtolnay rebuilds
        # the 1.99.1 branch on every master merge (orphaning its SHAs) and moves
        # master and v1, so any ref named here goes stale. The input picks Rust.
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          components: llvm-tools-preview
      - run: rustup toolchain uninstall stable # keeps rust-cache's key stable (see clippy)
      # Before rust-cache and install-action, so `sccache` is on PATH for any cargo they run.
      # The version matches GitLab's SCCACHE_VERSION. rust-cache (kept, D5) restores the
      # registry and compiled dependencies; sccache serves the workspace crates it discards.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning] -- CI publishes no artifact; the cache only speeds up checks
        with:
          key: ${{ matrix.shard }} # a cache entry per shard, so they do not overwrite one another
          save-if: ${{ github.event_name == 'push' }} # PR runs only read (see SCCACHE_GHA_RW_MODE)
      # Same release-tag pin as lint-tests (see the note there): never a per-tool tag.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,nextest
      # No ffmpeg here: only the #[ignore]d integration tests need it, and this job runs none.
      - name: coverage gate (per crate)
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/coverage-gate.sh "$SHARD"
      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
      - name: disk at end
        if: always()
        run: |
          df -h /
          du -sh target || true # absent when the job failed before building

  coverage:
    # Renamed and skipped in the release PR's run, like `lint` (see there).
    name: ${{ (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main') && 'coverage (release PR, checked by its push run)' || 'coverage' }}
    needs: coverage-shard
    # always(): a failed or cancelled shard must fail this check, not leave it skipped
    if: ${{ always() && !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: all coverage shards passed
        env:
          RESULT: ${{ needs.coverage-shard.result }}
        run: |
          echo "coverage-shard: $RESULT"
          [ "$RESULT" = success ]

[package]
name = "ferrofin-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ferrofin media server — a Rust implementation of the Jellyfin server speaking the same API"

[lints]
workspace = true

# The composition root lives in the library crate so the binary stays thin and
# the First-Light integration test can drive the boot sequence directly.
[lib]
name = "ferrofin_server"
path = "src/lib.rs"

[[bin]]
name = "ferrofin-server"
path = "src/main.rs"

[dependencies]
# every impl crate — this is the composition root that assembles them
ferrofin-api.workspace = true
ferrofin-core.workspace = true
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-db.workspace = true
ferrofin-common.workspace = true
ferrofin-naming.workspace = true
ferrofin-networking.workspace = true
ferrofin-health.workspace = true
ferrofin-mediaencoding.workspace = true
ferrofin-hls.workspace = true
ferrofin-drawing.workspace = true
ferrofin-providers.workspace = true
ferrofin-extensions.workspace = true
ferrofin-wasm.workspace = true
ferrofin-livetv.workspace = true
ferrofin-metrics.workspace = true

axum = { workspace = true, features = ["ws", "macros"] }
tower.workspace = true
# wasm_plugins integration test: compile the inline-WAT fixture component.
wat.workspace = true        # outer path-canonicalization layer (case-insensitive routing)
tower-http.workspace = true   # ServeDir/ServeFile for the static web client
tokio = { workspace = true }
async-trait.workspace = true
reqwest.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true   # best-effort system.json pre-read for log retention
shlex = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# OTLP trace export (off unless OTEL_EXPORTER_OTLP_ENDPOINT is set); see PLAN_TRACES.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
# manpage test: renders contrib/debian/ferrofin-server.1 from the clap `Cli`.
clap_mangen.workspace = true
tempfile.workspace = true
# restart integration test: drives the real `run()` over loopback HTTP.
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# First-Light integration test: drive the real router via tower oneshot and
# assert JSON bodies.
tower.workspace = true
# Decodes the gzip the response-compression layer produced, to prove the
# `/web` bundle survives it byte for byte.
flate2.workspace = true
# wasm_plugins integration test: compile the inline-WAT fixture component.
wat.workspace = true
# `testing` unlocks the in-memory span exporter for the tracing→OTel bridge smoke test.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# scan_change_detection: counts the rows each scan writes through triggers on
# the server's own database file.
sqlx.workspace = true
tracing-opentelemetry.workspace = true

# jemalloc's configure script cannot build under MSVC; main.rs cfg-gates the
# allocator the same way, so Windows falls back to the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

# ── Debian package (cargo-nfpm, also used by the release workflow) ──
[package.metadata.nfpm]
name = "ferrofin"
maintainer = "Giles Westwood <201443+gilesw@users.noreply.github.com>"
section = "video"
priority = "optional"
version = "${FERROFIN_VERSION}"
# v1.3.1 shipped 0:1.3.1-1 (issue #36): `epoch = "0"` printed the 0:, and
# cargo-nfpm defaults an unset release (and epoch) to "1". Empty omits both, so
# the Version is the tag minus its v. Never drop the epoch line: unset means 1.
epoch = ""
release = ""
license = "GPL-3.0-only"
homepage = "https://github.com/mangoleaf/ferrofin"
# First line is the synopsis; nfpm indents the rest into the extended description.
description = """Jellyfin-compatible media server written in Rust
Ferrofin serves the Jellyfin HTTP API, so existing Jellyfin web, mobile and
TV clients connect to it unchanged. It can adopt an existing Jellyfin
database in place. Adoption is one-way: Ferrofin keeps a
jellyfin.db.pre-ferrofin backup, then migrates the database, which may not
open under Jellyfin again. This package installs the server, a systemd
unit, configuration and the service user; ffmpeg and the web client come
from jellyfin-ffmpeg8 and jellyfin-web."""
# The glibc floor is enforced: release.yml builds against GLIBC_FLOOR and fails
# if the binary needs anything newer. Change both together.
depends = ["libc6 (>= 2.34)", "adduser", "jellyfin-ffmpeg8", "jellyfin-web"]
contents = [
    # /lib, where Jellyfin's jellyfin-server package puts its unit too.
    { src = "contrib/systemd/ferrofin.service", dst = "/lib/systemd/system/ferrofin.service", file_info = { mode = 420 } },
    { src = "contrib/debian/config.toml", dst = "/etc/ferrofin/config.toml", type = "config", file_info = { mode = 416 } },
    { src = "contrib/debian/copyright", dst = "/usr/share/doc/ferrofin/copyright", file_info = { mode = 420 } },
    { src = "README.md", dst = "/usr/share/doc/ferrofin/README.md", file_info = { mode = 420 } },
    { src = "docs/INSTALL.md", dst = "/usr/share/doc/ferrofin/INSTALL.md", file_info = { mode = 420 } },
    { src = "docs/CONFIG.md", dst = "/usr/share/doc/ferrofin/CONFIG.md", file_info = { mode = 420 } },
    { src = "docs/UPGRADING.md", dst = "/usr/share/doc/ferrofin/UPGRADING.md", file_info = { mode = 420 } },
    # Generated by contrib/debian/gen-docs.sh, which must run first.
    { src = "target/deb/changelog.gz", dst = "/usr/share/doc/ferrofin/changelog.gz", file_info = { mode = 420 } },
    { src = "target/deb/ferrofin-server.1.gz", dst = "/usr/share/man/man1/ferrofin-server.1.gz", file_info = { mode = 420 } },
    { src = "contrib/debian/lintian-overrides", dst = "/usr/share/lintian/overrides/ferrofin", file_info = { mode = 420 } },
]

[package.metadata.nfpm.scripts]
postinstall = "contrib/debian/postinst"
preremove = "contrib/debian/prerm"
postremove = "contrib/debian/postrm"

[package]
name = "ferrofin-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ferrofin media server — a Rust implementation of the Jellyfin server speaking the same API"

[lints]
workspace = true

# The composition root lives in the library crate so the binary stays thin and
# the First-Light integration test can drive the boot sequence directly.
[lib]
name = "ferrofin_server"
path = "src/lib.rs"

[[bin]]
name = "ferrofin-server"
path = "src/main.rs"

[dependencies]
# every impl crate — this is the composition root that assembles them
ferrofin-api.workspace = true
ferrofin-core.workspace = true
ferrofin-traits.workspace = true
ferrofin-model.workspace = true
ferrofin-db.workspace = true
ferrofin-common.workspace = true
ferrofin-naming.workspace = true
ferrofin-networking.workspace = true
ferrofin-health.workspace = true
ferrofin-mediaencoding.workspace = true
ferrofin-hls.workspace = true
ferrofin-drawing.workspace = true
ferrofin-providers.workspace = true
ferrofin-extensions.workspace = true
ferrofin-wasm.workspace = true
ferrofin-livetv.workspace = true
ferrofin-metrics.workspace = true

axum = { workspace = true, features = ["ws", "macros"] }
tower.workspace = true
# wasm_plugins integration test: compile the inline-WAT fixture component.
wat.workspace = true        # outer path-canonicalization layer (case-insensitive routing)
tower-http.workspace = true   # ServeDir/ServeFile for the static web client
tokio = { workspace = true }
async-trait.workspace = true
reqwest.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true   # best-effort system.json pre-read for log retention
shlex = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# OTLP trace export (off unless OTEL_EXPORTER_OTLP_ENDPOINT is set); see PLAN_TRACES.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
tempfile.workspace = true
# restart integration test: drives the real `run()` over loopback HTTP.
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# First-Light integration test: drive the real router via tower oneshot and
# assert JSON bodies.
tower.workspace = true
# Decodes the gzip the response-compression layer produced, to prove the
# `/web` bundle survives it byte for byte.
flate2.workspace = true
# wasm_plugins integration test: compile the inline-WAT fixture component.
wat.workspace = true
# `testing` unlocks the in-memory span exporter for the tracing→OTel bridge smoke test.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# scan_change_detection: counts the rows each scan writes through triggers on
# the server's own database file.
sqlx.workspace = true
tracing-opentelemetry.workspace = true

# jemalloc's configure script cannot build under MSVC; main.rs cfg-gates the
# allocator the same way, so Windows falls back to the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

# ── Debian package (cargo-deb; built by the release workflow, `cargo deb` locally) ──
# The package is named `ferrofin`, not `ferrofin-server`, and depends on the
# same jellyfin-ffmpeg8 + jellyfin-web the Docker image bundles — apt resolves
# them from Jellyfin's repository (docs/INSTALL.md adds it). Depends is spelled
# out rather than `$auto` because the aarch64 package is built --no-build from
# a cross-compiled binary that dpkg-shlibdeps cannot inspect on the x86 runner;
# the binary links nothing beyond libc (rustls, bundled SQLite).
[package.metadata.deb]
name = "ferrofin"
maintainer = "Giles Westwood <giles.westwood@gmail.com>"
copyright = "Ferrofin contributors; GPL-3.0-only"
license-file = ["../../LICENSE", "0"]
section = "video"
priority = "optional"
depends = "libc6 (>= 2.34), adduser, jellyfin-ffmpeg8, jellyfin-web"
extended-description = """\
Ferrofin is a from-scratch Rust implementation of the Jellyfin media server
speaking the same HTTP API, so existing Jellyfin clients connect unchanged.
It adopts an existing Jellyfin 10.11.x database in place. This package installs
the server, a hardened systemd unit (not enabled by default), a config file at
/etc/ferrofin/config.toml and the service user; ffmpeg and the web client come
from the jellyfin-ffmpeg8 and jellyfin-web packages."""
conf-files = ["/etc/ferrofin/config.toml"]
maintainer-scripts = "../../contrib/debian"
assets = [
    ["target/release/ferrofin-server", "usr/bin/ferrofin-server", "755"],
    ["../../contrib/systemd/ferrofin.service", "lib/systemd/system/ferrofin.service", "644"],
    ["../../contrib/debian/config.toml", "etc/ferrofin/config.toml", "640"],
    ["../../README.md", "usr/share/doc/ferrofin/README.md", "644"],
    ["../../docs/INSTALL.md", "usr/share/doc/ferrofin/INSTALL.md", "644"],
    ["../../docs/CONFIG.md", "usr/share/doc/ferrofin/CONFIG.md", "644"],
    ["../../docs/UPGRADING.md", "usr/share/doc/ferrofin/UPGRADING.md", "644"],
]

[workspace]
resolver = "3"
members = [
    "crates/hermit-util",
    "crates/hermit-keyframes",
    "crates/hermit-model",
    "crates/hermit-common",
    "crates/hermit-naming",
    "crates/hermit-networking",
    "crates/hermit-health",
    "crates/hermit-db",
    "crates/hermit-traits",
    "crates/hermit-mediaencoding",
    "crates/hermit-hls",
    "crates/hermit-drawing",
    "crates/hermit-providers",
    "crates/hermit-livetv",
    "crates/hermit-chromaprint",
    "crates/hermit-core",
    "crates/hermit-extensions",
    "crates/hermit-metrics",
    "crates/hermit-api",
    "apps/hermit-server",
    # crates are added here as each PortJob's SCAFFOLD stage lands them.
    # Dependency-ordered waves — see brain/PLAN_HERMIT_PORT.md:
    #   Wave 0: hermit-util, hermit-keyframes
    #   Wave 1: hermit-model
    #   Wave 2: hermit-common, hermit-naming, hermit-networking, hermit-health
    #   Wave 3: hermit-db          Wave 4: hermit-traits
    #   Wave 5: hermit-mediaencoding, hermit-hls, hermit-drawing, hermit-providers, hermit-livetv(stub)
    #   Wave 6: hermit-core        Wave 7: hermit-api        Wave 8: apps/hermit-server
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-only"          # matches the GPL-3.0-only package metadata on the Jellyfin crates being ported
publish = false
repository = "https://github.com/mangoleaf/hermit"

[workspace.lints.rust]
missing_docs = "warn"
# `coverage_nightly` is set by cargo-llvm-cov (nightly) to gate the
# `#[coverage(off)]` carve-outs on un-mockable I/O modules (e.g. the real
# ffmpeg spawn in hermit-mediaencoding). Register it so stable builds don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# product names in docs (SQLite, ffmpeg, DLNA, …) trip doc_markdown — allow it
doc_markdown = "allow"

[workspace.dependencies]
# ── intra-workspace (path deps added as crates land) ───────────────
hermit-util = { path = "crates/hermit-util" }
hermit-keyframes = { path = "crates/hermit-keyframes" }
hermit-model = { path = "crates/hermit-model" }
hermit-common = { path = "crates/hermit-common" }
hermit-naming = { path = "crates/hermit-naming" }
hermit-networking = { path = "crates/hermit-networking" }
hermit-health = { path = "crates/hermit-health" }
hermit-db = { path = "crates/hermit-db" }
hermit-traits = { path = "crates/hermit-traits" }
hermit-mediaencoding = { path = "crates/hermit-mediaencoding" }
hermit-hls = { path = "crates/hermit-hls" }
hermit-drawing = { path = "crates/hermit-drawing" }
hermit-providers = { path = "crates/hermit-providers" }
hermit-livetv = { path = "crates/hermit-livetv" }
hermit-chromaprint = { path = "crates/hermit-chromaprint" }
hermit-core = { path = "crates/hermit-core" }
hermit-extensions = { path = "crates/hermit-extensions" }
hermit-metrics = { path = "crates/hermit-metrics" }
hermit-api = { path = "crates/hermit-api" }

# ── http / async ───────────────────────────────────────────────────
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tokio = { version = "1", features = ["full"] }

# ── persistence: sqlx + SQLite (speed-first; see plan) ─────────────
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "uuid"] }

# ── serde / errors ─────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# ── observability / net ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ── openapi ────────────────────────────────────────────────────────
utoipa = "5"

# ── metrics: OpenTelemetry → prometheus exposition (hermit-metrics only) ─
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = "0.32"
# encode-only; hermit-metrics ONLY — the 0.32 exporter exposes no render helper,
# so `Registry` + `TextEncoder` come from a direct dep (dedupes with the exporter's ^0.14).
prometheus = { version = "0.14", default-features = false }

# ── domain helpers ─────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
libc = "0.2"
argon2 = "0.5"
pbkdf2 = "0.12"          # password hashing — matches Jellyfin's Rfc2898DeriveBytes.Pbkdf2
sha2 = "0.10"            # PBKDF2-HMAC-SHA512 (default hash id)
sha1 = "0.10"            # PBKDF2-HMAC-SHA1 (legacy "PBKDF2" hash id)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
blurhash = "0.2"         # ImageBlurHashes — functionally-valid hashes (not byte-identical to Jellyfin's Skia)
config = "0.15"
clap = { version = "4.5", features = ["derive"] }
bitflags = "2"
regex = "1"
fancy-regex = "0.14"    # for C# regexes that use lookaround
quick-xml = { version = "0.37", features = ["serialize"] }   # NFO/XBMC metadata parsing (hermit-providers)

# ── dev / test ─────────────────────────────────────────────────────
rstest = "0.23"         # [Theory]/[InlineData] → #[case] transliteration
insta = { version = "1", features = ["json"] }   # golden-file parity snapshots
tempfile = "3"          # temp SQLite files for hermit-db tests

[workspace]
resolver = "3"
members = [
    "crates/ferrofin-util",
    "crates/ferrofin-keyframes",
    "crates/ferrofin-model",
    "crates/ferrofin-common",
    "crates/ferrofin-naming",
    "crates/ferrofin-networking",
    "crates/ferrofin-health",
    "crates/ferrofin-db",
    "crates/ferrofin-traits",
    "crates/ferrofin-mediaencoding",
    "crates/ferrofin-hls",
    "crates/ferrofin-drawing",
    "crates/ferrofin-providers",
    "crates/ferrofin-livetv",
    "crates/ferrofin-chromaprint",
    "crates/ferrofin-core",
    "crates/ferrofin-extensions",
    "crates/ferrofin-wasm",
    "crates/ferrofin-metrics",
    "crates/ferrofin-api",
    "apps/ferrofin-server",
    # crates are added here as each PortJob's SCAFFOLD stage lands them.
    # Dependency-ordered (bottom-up port waves):
    #   Wave 0: ferrofin-util, ferrofin-keyframes
    #   Wave 1: ferrofin-model
    #   Wave 2: ferrofin-common, ferrofin-naming, ferrofin-networking, ferrofin-health
    #   Wave 3: ferrofin-db          Wave 4: ferrofin-traits
    #   Wave 5: ferrofin-mediaencoding, ferrofin-hls, ferrofin-drawing, ferrofin-providers, ferrofin-livetv(stub)
    #   Wave 6: ferrofin-core        Wave 7: ferrofin-api        Wave 8: apps/ferrofin-server
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-only"          # matches the GPL-3.0-only package metadata on the Jellyfin crates being ported
publish = false
repository = "https://github.com/mangoleaf/ferrofin"

[workspace.lints.rust]
missing_docs = "warn"
# `coverage_nightly` is set by cargo-llvm-cov (nightly) to gate the
# `#[coverage(off)]` carve-outs on un-mockable I/O modules (e.g. the real
# ffmpeg spawn in ferrofin-mediaencoding). Register it so stable builds don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# product names in docs (SQLite, ffmpeg, DLNA, …) trip doc_markdown — allow it
doc_markdown = "allow"

[workspace.dependencies]
# ── intra-workspace (path deps added as crates land) ───────────────
ferrofin-util = { path = "crates/ferrofin-util" }
ferrofin-keyframes = { path = "crates/ferrofin-keyframes" }
ferrofin-model = { path = "crates/ferrofin-model" }
ferrofin-common = { path = "crates/ferrofin-common" }
ferrofin-naming = { path = "crates/ferrofin-naming" }
ferrofin-networking = { path = "crates/ferrofin-networking" }
ferrofin-health = { path = "crates/ferrofin-health" }
ferrofin-db = { path = "crates/ferrofin-db" }
ferrofin-traits = { path = "crates/ferrofin-traits" }
ferrofin-mediaencoding = { path = "crates/ferrofin-mediaencoding" }
ferrofin-hls = { path = "crates/ferrofin-hls" }
ferrofin-drawing = { path = "crates/ferrofin-drawing" }
ferrofin-providers = { path = "crates/ferrofin-providers" }
ferrofin-livetv = { path = "crates/ferrofin-livetv" }
ferrofin-chromaprint = { path = "crates/ferrofin-chromaprint" }
ferrofin-core = { path = "crates/ferrofin-core" }
ferrofin-extensions = { path = "crates/ferrofin-extensions" }
ferrofin-wasm = { path = "crates/ferrofin-wasm" }
ferrofin-metrics = { path = "crates/ferrofin-metrics" }
ferrofin-api = { path = "crates/ferrofin-api" }

# ── http / async ───────────────────────────────────────────────────
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip", "compression-br"] }
# Decoders for the response-compression tests only (the server never decodes a
# response it just encoded). Same versions tower-http already links.
flate2 = "1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }   # .cbz/.epub archives (ferrofin-providers books)
brotli = "8.0"
tokio = { version = "1", features = ["full"] }
# The `Stream` trait `axum::body::Body::from_stream` takes — the progressive
# (tail-following) response bodies the Live TV live-stream/recording routes serve.
futures-core = "0.3"
# WebSocket client for the /socket integration tests only. Same version axum
# 0.8 already links for its `ws` feature, so it adds no new compilation.
tokio-tungstenite = "0.29"
futures-util = "0.3"
notify = "8.2"

# ── persistence: sqlx + SQLite (speed-first; see plan) ─────────────
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "uuid"] }
# Direct handle on the SQLite C API, pinned to the exact version sqlx resolves so
# cargo unifies them to ONE linked copy — a second copy would mean a second,
# unconfigured SQLite. Used only to call sqlite3_config() before any connection.
libsqlite3-sys = "0.30.1"

# ── serde / errors ─────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# The `$.Field[0]` path in a body-binder rejection: serde's own error names the
# type, not the member that failed, and ASP.NET's ValidationProblemDetails keys
# its `errors` dictionary by path. ferrofin-api's JsonBody extractor only.
serde_path_to_error = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# ── allocator (server-only: glibc malloc convoyed under 64 threads) ─
# `background_threads` is load-bearing for memory, not speed: without it jemalloc
# only purges dirty pages while it is *being called*, so an idle server never
# returns anything and peak RSS becomes a permanent ratchet. See the comment on
# the `#[global_allocator]` in `apps/ferrofin-server/src/main.rs`.
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms", "background_threads"] }

# ── observability / net ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ── openapi ────────────────────────────────────────────────────────
utoipa = "5"

# ── metrics + traces: OpenTelemetry ────────────────────────────────
# metrics → prometheus exposition (ferrofin-metrics only); traces → OTLP gRPC
# (ferrofin-server only). The 0.33 tracing-opentelemetry pairs with otel 0.32
# (the expected +1 offset); bump both together if otel ever moves.
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-prometheus = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
# encode-only; ferrofin-metrics ONLY — the 0.32 exporter exposes no render helper,
# so `Registry` + `TextEncoder` come from a direct dep (dedupes with the exporter's ^0.14).
prometheus = { version = "0.14", default-features = false }

# ── WASM plugin host (Tier 1b — see docs/EXTENSIONS.md) ──
# Component-model runtime for sandboxed third-party plugins. Always compiled
# in (decision 2026-08-07); MSRV 1.94 ≤ our pinned toolchain.
wasmtime = "47"
wasmtime-wasi = "47"    # locked-down empty WASI ctx (no preopens/sockets) so std guests link
wat = "1.256"            # dev-only in practice: inline-WAT test fixtures (no committed .wasm)

# ── domain helpers ─────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
libc = "0.2"
argon2 = "0.5"
pbkdf2 = "0.12"          # password hashing — matches Jellyfin's Rfc2898DeriveBytes.Pbkdf2
sha2 = "0.10"            # PBKDF2-HMAC-SHA512 (default hash id)
sha1 = "0.10"            # PBKDF2-HMAC-SHA1 (legacy "PBKDF2" hash id)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"                                        # photo EXIF (ferrofin-drawing PhotoProvider)
webp = { version = "0.3", default-features = false }  # LOSSY WebP encode via libwebp (BSD-3) — image-webp is lossless-only; Skia parity needs Google's encoder
jpeg-encoder = "0.7"     # JPEG encode with 4:2:0 chroma subsampling — the `image` crate's encoder is hardcoded 4:4:4; Skia's SkJpegEncoder defaults to 4:2:0
blurhash = "0.2"         # ImageBlurHashes — functionally-valid hashes (not byte-identical to Jellyfin's Skia)
config = "0.15"
clap = { version = "4.5", features = ["derive"] }
bitflags = "2"
# CRC-32 (reflected zlib polynomial) for the HDHomeRun control protocol's packet
# checksum — a port of `MediaBrowser.Common/Crc32.cs`, whose own tests pin
# 0x414fa339 for "The quick brown fox...". Already in the lock file as a
# transitive dependency of flate2/zip, so it adds no new compilation.
crc32fast = "1.5"
regex = "1"
# CLDR root collation — the port of .NET `StringComparison.InvariantCulture`
# used by the Live TV name sort. ICU4X 2.x is already in the tree (icu_normalizer
# 2.2 via idna), so this shares icu_collections/icu_provider/zerovec.
icu_collator = "2"
fancy-regex = "0.14"    # for C# regexes that use lookaround
quick-xml = { version = "0.37", features = ["serialize"] }   # NFO/XBMC metadata parsing (ferrofin-providers)

# ── dev / test ─────────────────────────────────────────────────────
rstest = "0.23"         # [Theory]/[InlineData] → #[case] transliteration
insta = { version = "1", features = ["json"] }   # golden-file parity snapshots
tempfile = "3"          # temp SQLite files for ferrofin-db tests

# ── build profiles ─────────────────────────────────────────────────
# Release-speed binary with full debug info, for samply/perf/heaptrack
# symbolization (PLAN_OPTIMIZE_HOTSPOTS phase 0). Never shipped: release
# stays lean; this exists so profiling is one flag, not a Cargo.toml edit.
[profile.profiling]
inherits = "release"
debug = true
strip = false

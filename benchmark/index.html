<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermit vs Jellyfin — benchmark viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef; --muted: #8b93a7;
    --accent: #58a6ff; --good: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 24px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; min-width: 130px; }
  .stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 16px 24px;
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  label.pick { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  input, select { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=search] { flex: 1 1 220px; }
  .chk { flex-direction: row; align-items: center; gap: 6px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }
  main { padding: 8px 24px 48px; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 28px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 61px; background: var(--bg); color: var(--muted); font-weight: 600;
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
  th:hover { color: var(--fg); }
  tbody tr:hover { background: #12151c; }
  code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.good { background: #10261699; border: 1px solid #204a2b; }
  .pill.bad { background: #260f0f99; border: 1px solid #4a1c1c; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Hermit ⇄ Jellyfin — benchmark viewer</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="stats" id="stats"></div>
</header>

<div class="controls">
  <label class="pick">Version<select id="ver"></select></label>
  <label class="pick">Compare to<select id="cmp"></select></label>
  <label class="pick chk"><input type="checkbox" id="onlyChanged"> only changed</label>
  <label class="pick chk"><input type="checkbox" id="hideJf"> hide Jellyfin cols</label>
  <input type="search" id="q" placeholder="filter endpoints…">
</div>

<main>
  <h2 id="latTitle">Latency</h2>
  <table id="lat"><thead></thead><tbody></tbody></table>
  <div class="note" id="latNote"></div>

  <h2>Footprint</h2>
  <table id="foot"><thead></thead><tbody></tbody></table>
</main>

<script>
const $ = s => document.querySelector(s);
let DATA = null, sortKey = null, sortDir = -1;

fetch('bench-data.json').then(r => r.json()).then(d => {
  DATA = d.versions;
  if (!DATA.length) { $('#sub').textContent = 'no benchmark reports found — run ./run.sh first'; return; }
  const opts = DATA.map((v, i) => `<option value="${i}">${v.hermit} — ${v.when}</option>`).join('');
  $('#ver').innerHTML = opts;
  $('#cmp').innerHTML = `<option value="-1">— none (single view) —</option>` + opts;
  $('#ver').value = DATA.length - 1;   // newest by default
  $('#cmp').value = -1;                // no comparison by default
  for (const el of ['ver','cmp','q','onlyChanged','hideJf'])
    $('#'+el).addEventListener('input', render);
  render();
});

const fmt = (n, d=2) => n == null ? '·' : n.toFixed(d);
const pct = (a, b) => (a == null || b == null || a === 0) ? null : (b - a) / a * 100;

function speedCell(s) {
  if (s == null) return '<td class="muted">·</td>';
  return `<td><span class="pill ${s >= 1 ? 'good' : 'bad'}">${s.toFixed(2)}×</span></td>`;
}
function deltaCell(p) {
  if (p == null) return '<td class="muted">·</td>';
  const cls = p < 0 ? 'good' : (p > 0 ? 'bad' : 'muted');
  return `<td class="${cls}">${p > 0 ? '+' : ''}${p.toFixed(0)}%</td>`;
}
function okCell(h, j) {  // flag any sub-100% 200-rate — a broken/unimplemented row
  const bad = v => v != null && v < 100;
  const c = x => bad(x) ? `<span class="bad">${x}%</span>` : `${x == null ? '·' : x + '%'}`;
  return `<td>${c(h)} / ${c(j)}</td>`;
}

function endpointMap(v) { return Object.fromEntries(v.endpoints.map(e => [e.name, e])); }

function render() {
  const V = DATA[+$('#ver').value];
  const ci = +$('#cmp').value;
  const C = ci >= 0 && ci !== +$('#ver').value ? DATA[ci] : null;
  const q = $('#q').value.trim().toLowerCase();
  const onlyChanged = $('#onlyChanged').checked;
  const hideJf = $('#hideJf').checked;
  $('#cmp').disabled = false;

  $('#sub').innerHTML = C
    ? `<b>${C.hermit}</b> → <b>${V.hermit}</b> · Jellyfin <code>${V.jellyfin}</code> · ${V.library}`
    : `<b>${V.hermit}</b> · ${V.when} · Jellyfin <code>${V.jellyfin}</code> · ${V.library}`;

  C ? renderCompare(V, C, q, onlyChanged, hideJf) : renderSingle(V, q, hideJf);
  renderFootprint(V, C, hideJf);
}

// ── single-version view ─────────────────────────────────────────────────────
function renderSingle(V, q, hideJf) {
  $('#latTitle').textContent = 'Latency (ms, p50 / p95 / p99) and throughput';
  $('#latNote').innerHTML = 'Speedup = Jellyfin p50 ÷ Hermit p50 (>1 = Hermit faster). '
    + 'A 200-rate below 100% flags a row that errored — a parity/impl bug, not a perf signal.';
  let rs = V.endpoints.map(e => ({ ...e, speedup: e.speedup }));
  const wins = rs.filter(e => e.speedup != null && e.speedup >= 1).length;
  const total = rs.filter(e => e.speedup != null).length;
  const broken = rs.filter(e => (e.h_ok != null && e.h_ok < 100)).length;
  const spds = rs.map(e => e.speedup).filter(x => x != null).sort((a, b) => a - b);
  const med = spds.length ? spds[Math.floor(spds.length / 2)] : null;
  $('#stats').innerHTML = statCards([
    ['endpoints', rs.length],
    ['Hermit wins', `${wins}/${total}`, 'good'],
    ['median speedup', med == null ? '·' : med.toFixed(2) + '×', med >= 1 ? 'good' : 'bad'],
    ['errored rows', broken, broken ? 'bad' : ''],
  ]);

  if (sortKey === null) { sortKey = 'speedup'; sortDir = -1; }
  const cols = [['name', 'Endpoint'], ['h_p50', 'p50'], ['h_p95', 'p95'], ['h_p99', 'p99'],
    ['h_rps', 'RPS H'], ['okc', '200-rate H/J'], ['speedup', 'Speedup']];
  if (!hideJf) cols.push(['j_p50', 'JF p50']);
  drawTable(rs, cols, q, false, r => {
    let t = `<td><code>${r.name}</code></td><td>${fmt(r.h_p50)}</td><td>${fmt(r.h_p95)}</td>`
      + `<td>${fmt(r.h_p99)}</td><td class="muted">${fmt(r.h_rps, 1)}</td>`
      + okCell(r.h_ok, r.j_ok) + speedCell(r.speedup);
    if (!hideJf) t += `<td class="muted">${fmt(r.j_p50)}</td>`;
    return t;
  });
}

// ── A→B comparison view ─────────────────────────────────────────────────────
function renderCompare(V, C, q, onlyChanged, hideJf) {
  $('#latTitle').innerHTML = 'Latency — Hermit p50 (ms), A→B';
  $('#latNote').innerHTML = 'Δ = (B−A)/A of Hermit p50 — <span class="good">green faster</span>, '
    + '<span class="bad">red slower</span>. Speedup = Jellyfin p50 ÷ Hermit p50.';
  const a = endpointMap(C), b = endpointMap(V);
  const names = [...new Set([...V.endpoints.map(e => e.name), ...C.endpoints.map(e => e.name)])];
  let rs = names.map(name => ({
    name, a_p50: a[name]?.h_p50 ?? null, b_p50: b[name]?.h_p50 ?? null, b_p95: b[name]?.h_p95 ?? null,
    dp50: pct(a[name]?.h_p50, b[name]?.h_p50), a_spd: a[name]?.speedup ?? null,
    b_spd: b[name]?.speedup ?? null, j_p50: b[name]?.j_p50 ?? null,
  }));

  const both = rs.filter(r => r.a_p50 != null && r.b_p50 != null);
  const faster = both.filter(r => r.dp50 < -0.5).length;
  const slower = both.filter(r => r.dp50 > 0.5).length;
  const bWins = rs.filter(r => r.b_spd != null && r.b_spd >= 1).length;
  const bTot = rs.filter(r => r.b_spd != null).length;
  const ds = both.map(r => r.dp50).sort((x, y) => x - y);
  const medD = ds.length ? ds[Math.floor(ds.length / 2)] : null;
  $('#stats').innerHTML = statCards([
    ['endpoints', rs.length],
    ['faster in B', faster, 'good'], ['slower in B', slower, 'bad'],
    ['median Δ p50', medD == null ? '·' : (medD > 0 ? '+' : '') + medD.toFixed(0) + '%', medD == null ? '' : (medD < 0 ? 'good' : 'bad')],
    ['B beats Jellyfin', `${bWins}/${bTot}`],
  ]);

  if (sortKey === null || !['name','a_p50','b_p50','dp50','b_p95','a_spd','b_spd','j_p50'].includes(sortKey)) {
    sortKey = 'dp50'; sortDir = -1;
  }
  const cols = [['name', 'Endpoint'], ['a_p50', 'A p50'], ['b_p50', 'B p50'], ['dp50', 'Δ p50'],
    ['b_p95', 'B p95'], ['a_spd', 'A speedup'], ['b_spd', 'B speedup']];
  if (!hideJf) cols.push(['j_p50', 'B JF p50']);
  drawTable(rs, cols, q, onlyChanged, r => {
    let t = `<td><code>${r.name}</code></td><td>${fmt(r.a_p50)}</td><td>${fmt(r.b_p50)}</td>`
      + deltaCell(r.dp50) + `<td class="muted">${fmt(r.b_p95)}</td>` + speedCell(r.a_spd) + speedCell(r.b_spd);
    if (!hideJf) t += `<td class="muted">${fmt(r.j_p50)}</td>`;
    return t;
  });
}

function statCards(items) {
  return items.map(([l, n, c]) =>
    `<div class="stat"><div class="n ${c || ''}">${n}</div><div class="l">${l}</div></div>`).join('');
}

function drawTable(rs, cols, q, onlyChanged, rowHtml) {
  if (q) rs = rs.filter(r => r.name.toLowerCase().includes(q));
  if (onlyChanged) rs = rs.filter(r => r.dp50 != null && Math.abs(r.dp50) >= 1);
  rs.sort((x, y) => {
    const xv = x[sortKey], yv = y[sortKey];
    if (typeof xv === 'string') return sortDir * xv.localeCompare(yv);
    return sortDir * ((xv ?? -Infinity) - (yv ?? -Infinity));
  });
  $('#lat thead').innerHTML = '<tr>' + cols.map(([k, l]) =>
    `<th data-k="${k}">${l}${sortKey === k ? (sortDir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('') + '</tr>';
  $('#lat thead').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'name' ? 1 : -1; }
    render();
  });
  $('#lat tbody').innerHTML = rs.length
    ? rs.map(r => `<tr>${rowHtml(r)}</tr>`).join('')
    : `<tr><td class="empty" colspan="${cols.length}">no endpoints match</td></tr>`;
}

function renderFootprint(V, C, hideJf) {
  const ca = C ? Object.fromEntries(C.footprint.map(f => [f.metric, f])) : {};
  const head = C
    ? `<th>Metric</th><th>A Hermit</th><th>B Hermit</th>` + (hideJf ? '' : '<th>B Jellyfin</th>')
    : `<th>Metric</th><th>Hermit</th>` + (hideJf ? '' : '<th>Jellyfin</th>');
  $('#foot thead').innerHTML = '<tr>' + head + '</tr>';
  $('#foot tbody').innerHTML = V.footprint.map(f => {
    const cells = C
      ? `<td class="muted">${ca[f.metric] ? ca[f.metric].hermit : '·'}</td><td>${f.hermit}</td>`
      : `<td>${f.hermit}</td>`;
    return `<tr><td>${f.metric}</td>${cells}` + (hideJf ? '' : `<td class="muted">${f.jellyfin}</td>`) + '</tr>';
  }).join('');
}
</script>
</body>
</html>

# suite/bench.conf — every methodology knob of the benchmark suite, at its default.
#
# This file is COMMITTED and lists ALL settings so there is one place to see and
# change them. Resolution order (suite/perf/config.py + suite_load_bench_conf):
#     code default  <  this file  <  process environment
# A missing file or missing line falls back to the code default; editing a value
# here changes the next run; env vars remain for one-off overrides (CI, sweeps).
# Resolved values are recorded into every run record's meta, so a published
# record is self-describing regardless of where a value came from.
#
# Host identity (media dirs, Jellyfin image pin, resource caps, ports, creds)
# stays in suite/perf/.env — machine-specific and uncommitted, not methodology.

# ── Statistics (workstream C/D) ────────────────────────────────────────────────
# Independent full runs aggregated into one published record (median ± IQR).
BENCH_RUNS=5
# Latency deltas below this are ties everywhere (tables, win/loss, gate) —
# host-local jitter floor; re-derive on rebaseline.
BENCH_NOISE_FLOOR_MS=3

# ── Open-loop load (workstream G/I) ────────────────────────────────────────────
# Windows are SAMPLE-COUNT-based, not flat wall-time: percentile precision
# scales with samples, and a flat 30 s at calibrated rates collects 10-100×
# more than the tails need while multiplying total runtime by 118 endpoints.
# Per endpoint: duration = clamp(BENCH_MIN_SAMPLES / rate,
#                                BENCH_MIN_WINDOW_SECS, BENCH_DURATION_SECS).
# Both servers get the identical rate AND duration per endpoint (recorded).
BENCH_MIN_SAMPLES=1000
BENCH_MIN_WINDOW_SECS=5
# The CAP on a window (slow endpoints stop here rather than running minutes).
BENCH_DURATION_SECS=30
# Fallback arrival rate (req/s) for endpoints without a calibrated entry in
# suite/perf/rates.json; runs using it are stamped rate_source=flat-default.
BENCH_RATE=25
# Calibrated per-endpoint rate = this fraction of the weaker server's measured
# saturation (suite/perf/compare.py --calibrate-rates writes rates.json).
BENCH_RATE_FRACTION=0.5
# Cap on any calibrated rate (req/s). Ultra-cheap endpoints calibrate to
# 10-30k/s (half of a closed-loop max-attack), which exceeds what the PACED
# open-loop scheduler can dispatch (~12-13k/s measured on the bench host) —
# those windows then fail rate-held. Past ~2k/s the latency-at-load comparison
# gains nothing; the cap keeps every window inside the generator's envelope.
# Applied at use (rates.json keeps raw measurements); capped rows are stamped
# rate_source=calibrated-capped.
BENCH_RATE_MAX=2000
# A measured window whose achieved rate falls below tolerance × target fails
# the leg (generator saturation would silently reintroduce a closed loop).
BENCH_RATE_TOLERANCE=0.99

# ── Warm/cold protocol (workstream H) ─────────────────────────────────────────
# Warmup is two-stage, identical on both servers (so the comparison is never
# Rust-vs-quick-JIT): ONE global pass cycling every endpoint after bring-up
# (.NET tier-1 promotion is per-method and mostly shared code across these
# endpoints — promoting it once beats paying 90 s × 117 endpoints ≈ 4 h/server),
# then a short same-endpoint top-up at the measured rate before each window
# (per-endpoint code paths + caches). Promotion is call-count-based (~30 calls
# + background compile); the global pass delivers 50-200 calls/endpoint and the
# top-up hundreds more. Verify empirically by lengthening the top-up until
# Jellyfin's p50 stops improving.
BENCH_GLOBAL_WARMUP_SECS=60
BENCH_WARMUP_SECS=10
# Promotion is call-COUNT-based, so a time-based top-up under-warms slow
# endpoints (10 s at 3 req/s = 30 calls only at half tolerance): the top-up is
# stretched to at least this many calls at the measured rate. 30 = .NET's
# default tiered-compilation call-count threshold.
BENCH_WARMUP_MIN_CALLS=30
# Cold leg: first-N requests per sentinel endpoint on a fresh server process.
BENCH_COLD_REQUESTS=10
# Max wait for the restarted server's API to actually ACCEPT requests —
# Jellyfin 200s /System/Info/Public while still initializing and 503s
# authenticated routes; the not-ready window is recorded per row
# (ready_wait_ms), separate from the cold first-request number.
BENCH_COLD_READY_TIMEOUT_SECS=120
# Sentinels for the cold leg — the server is RESTARTED before each (hitting one
# endpoint warms shared state for the next, so per-endpoint cold needs a fresh
# process each time). Empty disables the cold leg.
BENCH_COLD_ENDPOINTS=info_public user_me items_sortname items_mixed item_detail persons studios suggestions movie_recommendations items_filters2 image_primary

# ── Saturation sweep (workstream G2) ──────────────────────────────────────────
# The sweep's knee: lowest rate at which p99 exceeds this (ms).
BENCH_KNEE_P99_MS=250

# ── Login storm ───────────────────────────────────────────────────────────────
# The auth_login window runs open-loop too, in its own window after the main
# legs drain (PBKDF2 saturates CPU; in-loop it would poison every other row).
BENCH_LOGIN_RATE=10
BENCH_LOGIN_DURATION_SECS=15

# ── Regression gate ───────────────────────────────────────────────────────────
PERF_GATE_FACTOR=1.5
PERF_GATE_SECONDS=10
# Open-loop arrival rate for the gate's sentinel windows (req/s) — light by
# design; a regression shows as latency, not generator slowdown.
PERF_GATE_RATE=25

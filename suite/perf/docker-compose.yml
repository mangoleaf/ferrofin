# Both servers, identical resource caps, same read-only fixture library.
# run.sh brings them up ONE AT A TIME (never concurrently — contention corrupts both).
# Explicit project name: the folder moved once already (benchmark/ → suite/perf/) and the
# directory-derived default orphans old containers/volumes on rename.
name: ferrofin-bench
services:
  ferrofin:
    build:
      context: ../..
      dockerfile: suite/perf/Dockerfile.ferrofin
      args:
        # Host `git describe`, baked into the binary and verified back over
        # /health/live before any measurement window (stale-binary guard, B1).
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
    image: ferrofin-bench:local
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${FERROFIN_HOST_PORT:-18096}:8096"]   # host 8096 is often a live dev Ferrofin — stay clear
    environment:
      FERROFIN_ADMIN_USER: ${BENCH_ADMIN_USER}
      FERROFIN_ADMIN_PASSWORD: ${BENCH_ADMIN_PASSWORD}
      FERROFIN_DATA_DIR: /data
      FERROFIN_BIND_ADDR: 0.0.0.0
      FERROFIN_PORT: "8096"
      # Pool-sweep knob (benchmark/pool-sweep.sh): empty ⇒ Ferrofin's own default.
      FERROFIN_DB_POOL: ${FERROFIN_DB_POOL:-}
      # Lets the sweep surface the db_pool sampler (RUST_LOG=ferrofin_server=debug).
      RUST_LOG: ${BENCH_RUST_LOG:-info}
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - ferrofin-data:/data

  jellyfin:
    image: ${JELLYFIN_IMAGE}
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${JELLYFIN_HOST_PORT:-18097}:8096"]
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - jellyfin-config:/config
      - jellyfin-cache:/cache

# Named volumes so `docker compose down -v` gives each run a clean DB.
volumes:
  ferrofin-data:
  jellyfin-config:
  jellyfin-cache:

# Both servers, identical resource caps, same read-only fixture library.
# run.sh brings them up ONE AT A TIME (never concurrently — contention corrupts both).
# Explicit project name: the folder moved once already (benchmark/ → suite/perf/) and the
# directory-derived default orphans old containers/volumes on rename.
name: ferrofin-bench
services:
  ferrofin:
    build:
      context: ../..
      dockerfile: suite/perf/Dockerfile.ferrofin
      args:
        # Host `git describe`, baked into the binary and verified back over
        # /health/live before any measurement window (stale-binary guard, B1).
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
        # Per-checkout compile-cache scope (see Dockerfile.ferrofin) — set it
        # alongside COMPOSE_PROJECT_NAME when running from a worktree.
        CACHE_SCOPE: ${BENCH_CACHE_SCOPE:-shared}
    # The image TAG is scoped too: with a shared tag, a concurrent checkout's
    # rebuild silently replaces the binary a BENCH_SKIP_BUILD run picks up.
    # (B1's /health/live check caught exactly that — this removes the trap.)
    image: ferrofin-bench:${BENCH_CACHE_SCOPE:-local}
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${FERROFIN_HOST_PORT:-18096}:8096"]   # host 8096 is often a live dev Ferrofin — stay clear
    environment:
      FERROFIN_ADMIN_USER: ${BENCH_ADMIN_USER}
      FERROFIN_ADMIN_PASSWORD: ${BENCH_ADMIN_PASSWORD}
      # SAME data directory as the Jellyfin leg. The official jellyfin image
      # pins its data dir at /config, so Ferrofin is the side that moves: with
      # the two containers on different roots every data-dir-derived value
      # (library Path, playlists path, the metadata views path) differed by
      # deployment, and the parity harness — which correlates array elements by
      # Path — scored whole items as missing+extra without ever comparing a
      # field. Identical roots means a diff measures code, not deployment.
      # Container-internal only: no perf script reads this path (grep /data and
      # FERROFIN_DATA_DIR across suite/), so the shared perf leg is unaffected —
      # but the named volume stores absolute paths, so changing it needs the
      # volume re-provisioned, not just a container restart.
      FERROFIN_DATA_DIR: /config
      FERROFIN_BIND_ADDR: 0.0.0.0
      FERROFIN_PORT: "8096"
      # Pool-sweep knob (benchmark/pool-sweep.sh): empty ⇒ Ferrofin's own default.
      FERROFIN_DB_POOL: ${FERROFIN_DB_POOL:-}
      # Fairness: the Jellyfin leg runs with no plugins installed, so Ferrofin
      # must run with no extensions. Otherwise the intro skipper's and merge-
      # versions' scheduled tasks and event hooks fire inside Ferrofin's
      # measurement window and not inside Jellyfin's.
      FERROFIN_DISABLE_EXTENSIONS: ${BENCH_DISABLE_EXTENSIONS:-1}
      # Lets the sweep surface the db_pool sampler (RUST_LOG=ferrofin_server=debug).
      RUST_LOG: ${BENCH_RUST_LOG:-info}
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - ferrofin-config:/config

  jellyfin:
    image: ${JELLYFIN_IMAGE}
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${JELLYFIN_HOST_PORT:-18097}:8096"]
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - jellyfin-config:/config
      - jellyfin-cache:/cache

  # The Live TV fixture's "broadcast": an endless, real-time-paced MPEG-TS over HTTP on
  # the compose network (http://livetv-source:8000/live.ts), so both servers' M3U tuners
  # see a real network source that never ends (see livetv-source.py). Started by the
  # PARITY leg only — `docker compose up -d ferrofin jellyfin` (the perf leg) never does.
  livetv-source:
    image: python:3-alpine
    # loop.ts is the 60 s clip gen-fixtures.sh writes: the length paces the broadcast.
    command: ["python", "/srv/livetv-source.py", "/media/synth/livetv/loop.ts", "60", "8000"]
    volumes:
      - ./livetv-source.py:/srv/livetv-source.py:ro
      - ./fixtures/media:/media/synth:ro

# Named volumes so `docker compose down -v` gives each run a clean DB.
volumes:
  ferrofin-config:
  jellyfin-config:
  jellyfin-cache:

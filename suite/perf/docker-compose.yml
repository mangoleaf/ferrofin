# Both servers, identical resource caps, same read-only fixture library.
# run.sh brings them up ONE AT A TIME (never concurrently — contention corrupts both).
# Explicit project name: the folder moved once already (benchmark/ → suite/perf/) and the
# directory-derived default orphans old containers/volumes on rename.
name: hermit-bench
services:
  hermit:
    build:
      context: ../..
      dockerfile: suite/perf/Dockerfile.hermit
    image: hermit-bench:local
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${HERMIT_HOST_PORT:-18096}:8096"]   # host 8096 is often a live dev Hermit — stay clear
    environment:
      HERMIT_ADMIN_USER: ${BENCH_ADMIN_USER}
      HERMIT_ADMIN_PASSWORD: ${BENCH_ADMIN_PASSWORD}
      HERMIT_DATA_DIR: /data
      HERMIT_BIND_ADDR: 0.0.0.0
      HERMIT_PORT: "8096"
      # Pool-sweep knob (benchmark/pool-sweep.sh): empty ⇒ Hermit's own default.
      HERMIT_DB_POOL: ${HERMIT_DB_POOL:-}
      # Lets the sweep surface the db_pool sampler (RUST_LOG=hermit_server=debug).
      RUST_LOG: ${BENCH_RUST_LOG:-info}
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - hermit-data:/data

  jellyfin:
    image: ${JELLYFIN_IMAGE}
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEM}
    ports: ["${JELLYFIN_HOST_PORT:-18097}:8096"]
    volumes:
      - ${REAL_MEDIA_DIR:-./fixtures/empty}:/media/movies-real:ro
      - ${REAL_TV_DIR:-./fixtures/empty}:/media/tv-real:ro
      - ./fixtures/media:/media/synth:ro
      - jellyfin-config:/config
      - jellyfin-cache:/cache

# Named volumes so `docker compose down -v` gives each run a clean DB.
volumes:
  hermit-data:
  jellyfin-config:
  jellyfin-cache:

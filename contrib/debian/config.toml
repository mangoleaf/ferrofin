# Ferrofin configuration — installed by the .deb as /etc/ferrofin/config.toml
# (a conffile: dpkg never overwrites your edits on upgrade).
#
# Every key is documented in /usr/share/doc/ferrofin/CONFIG.md. Environment
# variables set in the unit (FERROFIN_FFMPEG_PATH, FERROFIN_FFPROBE_PATH,
# FERROFIN_WEB_DIR) take precedence over values here.

data_dir = "/var/lib/ferrofin"
bind_addr = "0.0.0.0"
port = 8096

# Set for a headless first boot; otherwise set the password in the web setup
# wizard. Keep this file owned by root:ferrofin, mode 0640. You can remove this
# entry once the account exists; it is only used when creating the first user.
#admin_password = ""

# Public URL clients should be told to use, when behind a reverse proxy.
#published_url = "https://media.example.org"

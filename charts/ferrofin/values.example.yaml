# =============================================================================
# Ferrofin — worked example values
# =============================================================================
# A realistic, fully-worked deployment: private registry, GPU transcoding,
# read-only media libraries, and separate persistent volumes for the database
# and the cache. Every environment-specific value below is a PLACEHOLDER — copy
# this file, then replace the `<...>` and example names with your own.
#
# For the full option reference and defaults, see values.yaml in this chart.
# Only the keys you override need to appear in your own values file.
# =============================================================================

replicaCount: 1

image:
  # The published image (public, no pull secret needed). Override it if you
  # mirror the image somewhere else.
  repository: ghcr.io/mangoleaf/ferrofin
  # Empty → the chart's appVersion. Pin a tag (e.g. "v1.0.0") in production.
  tag: ""
  pullPolicy: IfNotPresent

# Only needed if you mirror the image into a PRIVATE registry. Create the secret
# once in the release namespace:
#   kubectl create secret docker-registry <name> -n <namespace> \
#     --docker-server=<your-registry> \
#     --docker-username=<user> --docker-password=<token>
imagePullSecrets: []

# -----------------------------------------------------------------------------
# GPU transcoding (NVIDIA). Omit this whole block for CPU-only transcoding.
# -----------------------------------------------------------------------------
# `privileged` is the simplest way to give the container the GPU; if you run the
# NVIDIA device plugin with proper device requests you can often drop it.
securityContext:
  privileged: true

# Pod-level: the chart already defaults podSecurityContext to fsGroup 1000 with
# fsGroupChangePolicy OnRootMismatch (the image runs as uid 1000), so kubelet
# fixes volume ownership on mount — e.g. a cache PV once written by root.
# Override only if your storage needs a different gid.
# podSecurityContext:
#   fsGroup: 1000
#   fsGroupChangePolicy: OnRootMismatch

service:
  type: ClusterIP
  port: 8096

resources:
  limits:
    # Requires the NVIDIA device plugin installed in the cluster.
    nvidia.com/gpu: 1
    memory: 8Gi
    cpu: 8000m
  requests:
    memory: 2Gi
    cpu: 1000m

# -----------------------------------------------------------------------------
# Scheduling. REQUIRED when your PVs are node-local (e.g. StorageClass backed by
# a local disk): pin the pod to the node that physically holds the volumes.
# On network-attached storage (NFS/Ceph/cloud disks), delete this block only if
# you also set `strategy.type: Recreate` below or keep both pods of a rolling
# update on one node some other way. A surge pod on a second node over RWX
# storage can corrupt the SQLite database (see the chart README).
# -----------------------------------------------------------------------------
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["<storage-node>"]

# -----------------------------------------------------------------------------
# Upgrades. The default rolling update keeps playback going, and the old version
# keeps writing the database while the new one migrates it. Recreate stops the old
# pod first, and playback stops for the whole boot (see "Upgrades and the
# database" in the chart README).
# -----------------------------------------------------------------------------
# strategy:
#   type: Recreate

# -----------------------------------------------------------------------------
# Persistence — TWO separate volumes on purpose (see the volumes block below):
#   /data       → database, config.toml, metadata   (small, precious)
#   /data/cache → resized-image cache + transcodes   (large, regenerable, churny)
# Keeping the cache OFF the database volume means cache growth or transcode churn
# can never fill the volume your SQLite DB lives on and wedge the server.
# -----------------------------------------------------------------------------
persistence:
  config:
    enabled: true
    mountPath: /data
    # Use a pre-created PVC, or drop existingClaim and set size/storageClass to
    # let the chart create one.
    existingClaim: <ferrofin-config-pvc>
    # size: 10Gi
    # storageClass: ""

# -----------------------------------------------------------------------------
# Extra volumes: media libraries (read-only) + the dedicated cache volume.
# -----------------------------------------------------------------------------
volumes:
  # --- Media, mounted read-only (Ferrofin only ever reads your libraries) --------
  - name: media-tv
    persistentVolumeClaim:
      claimName: <media-tv-pvc>
  - name: media-movies
    persistentVolumeClaim:
      claimName: <media-movies-pvc>
  # --- Dedicated cache volume (image cache + transcode scratch) ----------------
  # NOTE: mount this at /data/cache, NOT /data/transcodes. Ferrofin writes BOTH the
  # resized-image cache (/data/cache/images) and transcode scratch
  # (/data/cache/transcodes) under {data_dir}/cache. Mounting only /data/transcodes
  # leaves the image cache on the database volume and this PV mostly unused.
  - name: ferrofin-cache
    persistentVolumeClaim:
      claimName: <ferrofin-cache-pvc>

volumeMounts:
  - name: media-tv
    mountPath: /media/TV
    readOnly: true
  - name: media-movies
    mountPath: /media/Movies
    readOnly: true
  # Whole cache dir on the dedicated volume — keeps cache/transcode churn off the
  # 10Gi-ish database volume.
  - name: ferrofin-cache
    mountPath: /data/cache

# -----------------------------------------------------------------------------
# Application config. `ferrofin.config` becomes a ConfigMap injected as env vars.
# Full config is FERROFIN_* env or {data_dir}/config.toml.
# -----------------------------------------------------------------------------
ferrofin:
  # Raw env (secrets, device flags). For a metadata provider key, prefer a Secret
  # referenced via `ferrofin.envFrom` rather than putting it here in plaintext.
  env:
    # GPU passthrough (drop if not using NVIDIA):
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "all"
  # Metadata provider keys from an existing Secret (e.g. FERROFIN_OMDB_KEY,
  # FERROFIN_TVDB_KEY), created once in the release namespace.
  # envFrom:
  #   - secretRef:
  #       name: <ferrofin-provider-keys>
  config:
    # Move the cache dir explicitly if you don't want the {data_dir}/cache default.
    # If you set this, mount your cache volume HERE instead of /data/cache.
    # FERROFIN_CACHE_DIR: "/data/cache"

    # The URL clients reach this server on (behind your ingress/reverse proxy).
    # FERROFIN_PUBLISHED_URL: "https://ferrofin.example.com"

    # Prometheus /metrics endpoint (scraped by the ServiceMonitor below; charted
    # by the Grafana dashboards further down).
    FERROFIN_ENABLE_METRICS: "true"
    FERROFIN_METRICS_SAMPLE_INTERVAL: "30"
    # Library-scan duration histogram buckets (seconds, ascending). Unset = the
    # default 1-2.5-5 per decade from 0.001 to 5000; set it only if your scans
    # routinely fall outside that range (a first scan of a huge NFS library).
    # FERROFIN_METRICS_SCAN_DURATION_BUCKETS: "0.01,0.1,1,10,60,300,1800,7200"

    # Log filter (EnvFilter syntax). Scan and provider detail is at debug.
    # FERROFIN_LOG: "info"
    # How many ffprobe processes a library scan runs at once (default: 8, capped
    # at the core count). Lower it for libraries on NFS or spinning disks.
    # FERROFIN_SCAN_PROBE_CONCURRENCY: "4"
    # A scan lists each folder once and keeps the listings for its items: they
    # are dropped past this many records (default 100000, Jellyfin's
    # MaxCachedRecords) or after this many idle seconds (default 300).
    # FERROFIN_SCAN_DIRECTORY_CACHE_RECORDS: "100000"
    # FERROFIN_SCAN_DIRECTORY_CACHE_IDLE_SECS: "300"
    # A comic book's runtime is its page count, read from its archive's directory;
    # an archive with more entries than this is not counted (1000-10000000,
    # default 100000).
    # FERROFIN_BOOK_ARCHIVE_MAX_ENTRIES: "100000"
    # Seconds a resolved access token, and a user's permissions with the libraries'
    # rows and options and whether a Live TV tuner exists, are served from memory
    # (5-300, default 30 each). Changes made through the server apply at once; these
    # only bound changes made outside it.
    # FERROFIN_AUTH_CACHE_TTL_SECS: "30"
    # FERROFIN_ROW_CACHE_TTL_SECS: "30"
    # Read the network interfaces again 2 s after the OS reports a network change
    # (Jellyfin's DetectNetworkChange, on by default).
    # FERROFIN_DETECT_NETWORK_CHANGE: "true"
    # Failed logins an account or a client address may make before its next attempts
    # wait (1 s, doubling to the maximum; the backoff never disables an account). Add the
    # ingress to Known proxies, or every client shares its address and one
    # guesser can get everyone's logins refused.
    # FERROFIN_LOGIN_BACKOFF: "true"
    # FERROFIN_LOGIN_BACKOFF_ATTEMPTS: "5"
    # FERROFIN_LOGIN_BACKOFF_MAX_DELAY_SECS: "30"
    # FERROFIN_LOGIN_BACKOFF_WINDOW_MINS: "15"
    # FERROFIN_LOGIN_BACKOFF_MAX_TRACKED: "100000"
    # Hours a session with no WebSocket that plays nothing is kept after its last
    # request (1 to 168, default 24). Jellyfin keeps such a session until it
    # restarts, so a client sending a new device id on every run grows memory.
    # FERROFIN_SESSION_IDLE_HOURS: "24"
    # Prepared statements each SQLite connection keeps (100-1024, default 150).
    # Each connection of the pool keeps its own, so a larger value costs memory
    # on every connection: 150 held 6-13 MiB more than 100 on an 8-core server.
    # FERROFIN_DB_STATEMENT_CACHE: "150"
    # Items whose genre, studio, tag and artist links one database transaction
    # rewrites when a metadata edit saves many at once (1-5000, default 500). A
    # smaller value holds the database writer for shorter stretches; "1" writes
    # each item's links on their own, as Jellyfin's per-item saves do.
    # FERROFIN_ITEM_VALUES_WRITE_CHUNK: "500"
    # How many videos generate trickplay images at once, each one's widths in
    # turn (default: auto, up to the image-encoding limit, one per CPU). Each
    # generation is an ffmpeg process, and with hardware acceleration holds GPU
    # memory; "1" matches Jellyfin.
    # FERROFIN_TRICKPLAY_CONCURRENCY: "1"
    # Trade frame quality for speed when extracting chapter images, video
    # thumbnails and embedded pictures: keyframes only, no 24-frame sampling
    # (default "false", Jellyfin's FFmpeg:imgExtractPerfTradeoff).
    # FERROFIN_FFMPEG_IMG_EXTRACT_PERF_TRADEOFF: "true"
    # How long and how much of an input ffmpeg analyses to find its streams,
    # before every probe and transcode (defaults "200M" microseconds and "1G"
    # bytes, Jellyfin's FFmpeg:analyzeduration and FFmpeg:probesize; 1M-600M
    # and 1M-4G). Lower values start remote (.strm) sources sooner and can
    # miss late streams.
    # FERROFIN_FFMPEG_ANALYZE_DURATION: "8M"
    # FERROFIN_FFMPEG_PROBE_SIZE: "32M"
    # How long TheTVDB lookups (episode ids, a series' season list) are reused,
    # in whole hours (default 1, the TVDB plugin's CacheDurationInHours).
    # FERROFIN_TVDB_CACHE_HOURS: "1"
    # How many days TheTVDB's sign-in token is reused before signing in again
    # (default 25, the TVDB plugin's value; 1 to 29, as tokens expire after a month).
    # FERROFIN_TVDB_TOKEN_DAYS: "25"

    # Export sampled request traces over OTLP gRPC to your collector (→ Tempo/Jaeger).
    # Off unless set; stdout stays structured JSON with a trace_id on each line.
    # OTEL_EXPORTER_OTLP_ENDPOINT: "http://<otel-collector>.<namespace>.svc.cluster.local:4317"
    # OTEL_TRACES_SAMPLER_ARG: "0.25"

    # What one image may cost in memory; past a limit, clients get the original
    # file instead of a thumbnail. Lower them for a small memory limit: the
    # decode limit is per image, the resize budget is shared.
    # FERROFIN_IMAGE_DECODE_MAX_MEGAPIXELS: "200"
    # FERROFIN_IMAGE_DECODE_MAX_MEMORY_MB: "512"
    # FERROFIN_IMAGE_RESIZE_BUDGET_MB: "2048"

    # The largest remote image downloaded (and the largest metadata provider
    # answer), and how long a URL that gave no image (a channel logo that is
    # gone, say) is left alone before it is tried again.
    # FERROFIN_IMAGE_DOWNLOAD_MAX_MB: "64"
    # FERROFIN_IMAGE_NEGATIVE_CACHE_TTL_SECS: "3600"
    # Image downloads refuse private/LAN addresses, a Live TV tuner's host
    # aside. List the LAN hosts or networks that serve your artwork:
    # FERROFIN_IMAGE_PRIVATE_HTTP_ALLOW: "nas.lan,192.168.1.0/24"
    # OpenSubtitles download links refuse private/LAN addresses too, with a list
    # of their own (the image list does not apply). Only a LAN mirror of the
    # download host needs it:
    # FERROFIN_SUBTITLE_PRIVATE_HTTP_ALLOW: "subtitles.lan"

    # The most jobs re-encoding a stream the server runs at once, and one user
    # runs at once. Past either cap the user's idle job on the same device is
    # ended first; with none to end, the client gets 503 with Retry-After. 0
    # means no cap.
    # FERROFIN_MAX_TRANSCODES: "0"
    # FERROFIN_MAX_TRANSCODES_PER_USER: "0"

    # WASM plugins (sandboxed, runtime-installed): install from a plugin
    # repository in the dashboard (Plugins → Repositories → Catalog), or place
    # .wasm components at {data_dir}/plugins/ — under the DATA volume above —
    # and restart the pod. The defaults below are generous; a well-behaved
    # plugin uses a few MiB (the memory limit is a ceiling, never a
    # reservation). Zero = unset.
    # FERROFIN_WASM_CALL_TIMEOUT_SECS: "30"     # per-call deadline for a plugin
    # FERROFIN_WASM_CALL_GRACE_SECS: "10"       # wait past it before a stuck plugin is disabled
    # FERROFIN_WASM_MEMORY_LIMIT_MB: "128"      # per-plugin memory cap
    # FERROFIN_WASM_EVENT_QUEUE_CAPACITY: "256" # per-plugin event queue depth
    # FERROFIN_MAX_PLUGIN_DOWNLOAD_MB: "128"    # repository-install artifact size cap
    # FERROFIN_WASM_ANALYSIS_CONCURRENCY: "2"   # plugin media-decode budget (default cores/4)
    # FERROFIN_WASM_STATE_LIMIT_MB: "8"          # per-plugin key/value state cap
    # FERROFIN_WASM_IMAGE_DOWNLOAD_MB: "20"     # cap on one plugin-artwork download
    # FERROFIN_WASM_IMAGE_TIMEOUT_SECS: "30"    # bound on one plugin-artwork GET
    # FERROFIN_WASM_WRITE_CONTENT_MB: "2"       # cap on one lyric/subtitle write
    # FERROFIN_WASM_SUBTITLE_EXTRACT_MB: "10"   # cap on one extracted subtitle track
    # Let SPECIFIC trusted plugins http-fetch private/LAN destinations
    # (default: denied for all; public internet is always allowed):
    # FERROFIN_WASM_PRIVATE_HTTP_ALLOW: "<plugin-uuid>,<plugin-uuid>"

# -----------------------------------------------------------------------------
# Metrics — Ferrofin exposes a Prometheus /metrics endpoint (enable it above via
# FERROFIN_ENABLE_METRICS). Turn on the ServiceMonitor if you run the Prometheus
# Operator.
# -----------------------------------------------------------------------------
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# -----------------------------------------------------------------------------
# Grafana dashboards (golden signals, deep dive, library scans) as a ConfigMap
# for the Grafana dashboard sidecar (kube-prometheus-stack / grafana chart with
# sidecar.dashboards.enabled). The label and folder annotation below are the
# sidecar's usual defaults; set them to whatever your sidecar watches.
# -----------------------------------------------------------------------------
dashboards:
  enabled: true
  # Only when the sidecar watches a single namespace (e.g. Grafana's own):
  # namespace: <grafana-namespace>
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder
  folder: Ferrofin

# -----------------------------------------------------------------------------
# Ingress — expose Ferrofin outside the cluster. Pick ingress OR httpRoute.
# -----------------------------------------------------------------------------
# ingress:
#   enabled: true
#   className: nginx
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt
#   hosts:
#     - host: ferrofin.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: ferrofin-tls
#       hosts:
#         - ferrofin.example.com
#
# httpRoute:            # Gateway API alternative to ingress
#   enabled: true
#   parentRefs:
#     - name: <gateway>
#       namespace: <gateway-namespace>
#   hostnames:
#     - ferrofin.example.com

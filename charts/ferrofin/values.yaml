# Default values for the Ferrofin chart.
# The value contract deliberately mirrors the subset of the upstream jellyfin-helm
# chart that a typical deployment uses, so switching a Jellyfin release to Ferrofin is
# near-zero churn: image, service, persistence.config, volumes/volumeMounts, probes,
# affinity, resources, metrics/serviceMonitor.
#
# Two intentional differences from jellyfin-helm:
#   - the app config block is `ferrofin:` (not `jellyfin:`), and has no enableDLNA (Ferrofin has no DLNA).
#   - config mounts at /data (Ferrofin's data dir), not /config.

# -- Number of Ferrofin replicas. Ferrofin is single-writer (SQLite); leave at 1.
replicaCount: 1

# -- Deployment update strategy. RollingUpdate + maxUnavailable 0 starts the new pod
# and waits for its readiness probe (/health/ready) before the old one is torn down,
# so an upgrade doesn't drop playback. The cost is an overlap: the old version keeps
# serving and writing the database for the whole of the new pod's boot, migrations and
# one-shot repairs included. On one node SQLite's locks protect the file, not the logic:
# rows the old version writes in that window can miss a one-shot repair for good, it can
# answer with errors while a long transaction holds the write lock (past the 30s busy
# timeout) or a migration changes a table it reads, and it cannot restart once the
# database has been migrated. `type: Recreate` opts out: only one version ever touches
# the database, and playback stops for the whole boot. See "Upgrades and the database"
# in the chart README.
#
# Two pods may share the database only from ONE node. SQLite's WAL needs a shared-memory
# index that two nodes cannot share, so a surge pod on a second node over an RWX volume
# (NFS, CephFS) can corrupt the database. Use RWO on one node, or keep both pods on one
# node (podAffinity or a node pin, see the README), or use Recreate. The surge pod must
# also schedule: with RWO it has to land on the old pod's node, and any exclusive
# resource in `resources` (e.g. nvidia.com/gpu) must have a spare unit. If that cannot
# hold, use Recreate.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  # -- Container image repository. Override if you mirror the image elsewhere.
  repository: ghcr.io/mangoleaf/ferrofin
  # -- Image tag. Empty → chart appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for the (private) registry. e.g. [{name: gitlab-registry}]
imagePullSecrets: []

# -- Service account for the pod.
serviceAccount:
  # -- Create a dedicated service account.
  create: true
  # -- Mount the SA's API token into the pod.
  automount: true
  # -- Annotations for the service account.
  annotations: {}
  # -- Name to use. Empty → generated from the fullname.
  name: ""

# -- Override the chart name.
nameOverride: ""
# -- Override the fully-qualified release name.
fullnameOverride: ""

# -- Annotations added to the pod.
podAnnotations: {}
# -- Labels added to the pod.
podLabels: {}

# -- Share the node network for LAN discovery. Requires a LAN-connected node,
# free ports 8096/TCP and 7359/UDP, and strategy.type: Recreate.
hostNetwork: false

# -- Pod-level security context. The image runs as uid 1000, so default
# fsGroup 1000: kubelet fixes volume group-ownership on mount (only when the
# volume root mismatches), so a PV written by root can never lock the server
# out of its own cache.
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
# -- Container-level security context (e.g. privileged for GPU passthrough).
securityContext: {}

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (also the container port Ferrofin listens on).
  port: 8096

# -- Optional UDP exposure; does not change the application's AutoDiscovery setting.
# A separate Service avoids mixing TCP and UDP on a LoadBalancer. Service exposure
# alone does not forward LAN broadcasts; see README.md for LAN topology.
discovery:
  enabled: false
  service:
    type: ClusterIP
    annotations: {}

# -- Ingress (standard networking.k8s.io/v1). Most clusters use this to expose Ferrofin.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: ferrofin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: ferrofin-tls
    #   hosts:
    #     - ferrofin.example.com

# -- HTTPRoute for the Gateway API (gateway.networking.k8s.io/v1). Alternative to ingress.
httpRoute:
  enabled: false
  annotations: {}
  # -- Gateways to attach to.
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
  # -- Hostnames to match.
  hostnames: []
    # - ferrofin.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# -- Resource requests/limits.
resources: {}

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}

# -- Extra volumes on the pod (media PVCs, hostPath /dev/dri, etc.).
volumes: []
# -- Extra volume mounts on the Ferrofin container.
volumeMounts: []

persistence:
  config:
    # -- Persist Ferrofin's data dir (SQLite DB, config.toml, metadata). false → emptyDir (ephemeral).
    enabled: true
    # -- Where the config/data volume mounts. Ferrofin's data dir.
    mountPath: /data
    # -- Use an existing PVC instead of letting the chart create one.
    existingClaim: ""
    # -- Size for the chart-created PVC (ignored when existingClaim is set).
    size: 10Gi
    # -- Access mode for the chart-created PVC. RWX does not make a rolling update safe
    # across nodes: see `strategy`.
    accessMode: ReadWriteOnce
    # -- StorageClass for the chart-created PVC. "" → cluster default. null → no storageClassName field.
    storageClass: ""
    annotations: {}

# -- Ferrofin application configuration.
ferrofin:
  # -- Extra CLI args passed to ferrofin-server (flags override FERROFIN_* env).
  args: []
  # -- Extra environment variables. Config is FERROFIN_* env or {data_dir}/config.toml.
  env: []
  # -- Load env from EXISTING ConfigMaps/Secrets (e.g. a Secret with FERROFIN_OMDB_KEY).
  envFrom: []
  # -- Key/value pairs rendered into a chart-managed ConfigMap and injected into
  # the container as environment variables (via envFrom). For non-secret config;
  # put secrets in a Secret referenced through `envFrom`. Changing a value rolls
  # the pod so it takes effect.
  config: {}
    # FERROFIN_PUBLISHED_URL: "https://ferrofin.example.com"
    # FERROFIN_LOG: "info"   # EnvFilter/RUST_LOG syntax, e.g. "debug" or "ferrofin_api=debug,info"
    # FERROFIN_ENABLE_METRICS: "true"   # serve Prometheus /metrics (see `metrics` below)
    # Bucket boundaries (seconds, ascending) of the library-scan duration histograms;
    # unset = 1-2.5-5 per decade from 0.001 to 5000 (see contrib/metrics/README.md).
    # FERROFIN_METRICS_SCAN_DURATION_BUCKETS: "0.01,0.1,1,10,60,300,1800,7200"

# -- Liveness probe. Ferrofin serves GET /health/live (process-only 200).
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 4

# -- Readiness probe. Ferrofin serves GET /health/ready (503 when the database does not answer).
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# -- Startup probe. Ferrofin binds its port before it adopts or migrates the database
# (a scheduled backup restore runs first), and answers while it does (/health/live 200, /health/ready 503, other
# requests 503 with Retry-After), so this passes as soon as the process is up and a
# long migration is never restarted by the liveness probe.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 30

# -- Metrics. Ferrofin serves Prometheus metrics on GET /metrics (the app port) once
# they are enabled in the app: set FERROFIN_ENABLE_METRICS=true (ferrofin.config or
# ferrofin.env) or EnableMetrics in system.json. These keys only add the
# ServiceMonitor that scrapes it; see contrib/metrics/README.md.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    # -- Namespace for the ServiceMonitor. "" → release namespace.
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 30s
    path: /metrics
    port: 8096
    scheme: http

# -- Grafana dashboards (golden signals, deep dive, library scans) as a ConfigMap for a
# Grafana dashboard sidecar (e.g. the kube-prometheus-stack / grafana chart sidecar),
# which loads every ConfigMap carrying `label: labelValue` and files it in the folder
# named by the `folderAnnotation` annotation. The dashboards read the metrics above,
# so enable metrics in the app and scrape them (metrics.serviceMonitor) too.
dashboards:
  enabled: false
  # -- Namespace for the ConfigMap. "" → release namespace. Set it when the sidecar
  # watches one namespace only (e.g. Grafana's own).
  namespace: ""
  # -- The label the sidecar selects dashboard ConfigMaps by (grafana sidecar
  # `sidecar.dashboards.label`), and its value (`sidecar.dashboards.labelValue`).
  label: grafana_dashboard
  labelValue: "1"
  # -- The annotation the sidecar reads the target folder from
  # (`sidecar.dashboards.folderAnnotation`), and the folder. "" → no folder annotation
  # (the sidecar's default folder). An empty `label` likewise adds no selector label.
  folderAnnotation: grafana_folder
  folder: Ferrofin
  # -- Extra labels on the ConfigMap.
  labels: {}
  # -- Extra annotations on the ConfigMap.
  annotations: {}

# -- NetworkPolicy for pod isolation. Needs a CNI that enforces it (Calico, Cilium, etc.).
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # -- Allow ingress from any pod/namespace. Set false to restrict to the selectors below.
    allowExternal: true
    podSelector: {}
    namespaceSelector: {}
    customRules: []
  egress:
    # -- Allow DNS (keep enabled — Ferrofin needs it for metadata providers).
    allowDNS: true
    dnsNamespace: kube-system
    dnsPodSelector:
      k8s-app: kube-dns
    # -- Allow all egress. Set false to use restrictedEgress below.
    allowAllEgress: true
    restrictedEgress:
      # -- Allow outbound HTTPS (metadata providers: TMDB, OMDb, MusicBrainz).
      allowMetadata: true
      # -- Allow pod-to-pod egress within the cluster.
      allowInCluster: true
      # -- Extra CIDRs to allow.
      allowedCIDRs: []
    customRules: []
  metrics:
    # -- Namespace Prometheus runs in. Empty → release namespace.
    namespace: ""
    podSelector:
      app.kubernetes.io/name: prometheus

{{- if .Values.hermit.config }}
# Chart-managed env ConfigMap: each key/value under `hermit.config` becomes an
# environment variable in the Hermit container (injected via envFrom in the
# Deployment). For non-secret configuration — use a Secret + hermit.envFrom for
# secrets. Changing these rolls the pod (see the checksum/config pod annotation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermit.fullname" . }}-env
  labels:
    {{- include "hermit.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.hermit.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

# Owner decision 2026-11-04, an accepted divergence: the transcode output name keys on the output shape.
# The playlist is not JSON, so `$` accepts the whole live playlist body, not only the segment names.
# The request carries an oracle_trap: a run whose Jellyfin stalls on it lists this entry under
# "matched nothing", which is not a reason to delete it.
[[entry]]
request = "GetLiveHlsStream"
path = "$"
kind = "value"
issue = 860
reason = "Transcode output names hash the output shape (tracks, codecs, bitrates, subtitles), not upstream's MD5 of MediaPath-UserAgent-DeviceId-PlaySessionId, so the live playlist names other segment files."


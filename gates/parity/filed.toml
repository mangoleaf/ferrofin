# The parity differences already filed as GitLab issues (`gl-<iid>`), so a run's report and its
# new-differences.json name the issue and `diff.py findings` does not offer them for filing again.
#
# A filed difference is still new: it fails the run until Ferrofin is fixed or the difference is accepted
# into ledger.toml. Add an entry here after filing (see gates/parity/README.md, "Filing new differences").
#
#   request   the request id, or a glob over request ids (`GetItems.*`)
#   path      the field path as the report prints it (`Items[].UserData.Key`); `$status` for the status
#   kind      one kind or a list of status, value, type, null, missing, extra, length, order
#   issue     the GitLab issue number
#
# [[filed]]
# request = "GetItems.*"
# path = "TotalRecordCount"
# kind = "value"
# issue = 830

version = 1

# The differences filed from the first sweep with the edge cases are accepted into ledger.toml with their
# issues (gl-619); add new filings here.

# ── filed from the replay of release/v1.4.0 at 37fad687 (2026-10-24) ────────────────────────────────
# The difference is not in ledger.toml; this run's Jellyfin answered the request. It carries an
# oracle_trap, so a run whose Jellyfin stalls on it compares nothing and lists this entry under
# "matched nothing": that is not a reason to delete it. The path `$` is the whole non-JSON body, so any
# other difference in this response is labelled with the same issue; it still fails the run.
# (gl-860, the other difference filed from this run, is now an accepted divergence in ledger.toml.)

# gl-832: HLS jobs lack upstream's -max_delay 5000000, so the first video segment's PCR starts at ffmpeg's
# 0.7 s default (Jellyfin: 5 s) and its PTS/DTS at 1.4 s (Jellyfin: 10 s).
[[filed]]
request = "GetHlsVideoSegment"
path = "$"
kind = "value"
issue = 832

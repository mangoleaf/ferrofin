# How gates/parity/generate.py builds the sweep from the vendored contract (see its docstring).
#
# Templates: `{movie}` and the other ids of the corpus's ids.json; `{found.<name>}` read from the oracle
# at run start (gates/parity/discover.toml); `{setup.<name>.<field>}` read from a setup step's answer on the
# same server, which puts that `[setups.<name>]` sequence in front of the write. Change this file, run
# gates/parity/generate.py, and commit both: the request set is checked in.

version = 1

# ── path parameters, by name ───────────────────────────────────────────────────────────────────────
[path]
itemId = "{movie}"
userId = "{user}"
videoId = "{movie}"
mediaSourceId = "{movie}"
routeItemId = "{movie}"
routeMediaSourceId = "{movie}"
seriesId = "{series}"
SeriesId = "{series}"
seasonId = "{season}"
SeasonId = "{season}"
id = "{episode}"
Id = "{episode}"
imageType = "Primary"
imageIndex = "0"
index = "0"
routeIndex = "0"
newIndex = "0"
genreName = "{found.genre}"
name = "{found.person}"
year = "2003"
playlistId = "{setup.playlist.Id}"
collectionId = "{setup.collection.Id}"
sessionId = "{setup.session.0.Id}"
key = "{setup.key.Items.0.AccessToken}"
taskId = "{found.task}"
displayPreferencesId = "usersettings"
language = "eng"
container = "mkv"
segmentContainer = "ts"
segmentId = "0"
routeFormat = "vtt"
routeStartPositionTicks = "0"
width = "320"
maxWidth = "200"
maxHeight = "300"
percentPlayed = "0"
unplayedCount = "0"
tag = "parity"
format = "jpg"
command = "DisplayMessage"
lyricId = "parity"
subtitleId = "parity"
# Live TV, plugins, packages and SyncPlay groups: the corpus has none, so these name nothing (the
# operation's own answer to an unknown id is what is compared)
recordingId = "00000000000000000000000000000001"
timerId = "00000000000000000000000000000001"
channelId = "00000000000000000000000000000001"
programId = "00000000000000000000000000000001"
groupId = "00000000000000000000000000000001"
streamId = "00000000000000000000000000000001"
tunerId = "00000000000000000000000000000001"
packageId = "00000000000000000000000000000001"
pluginId = "00000000000000000000000000000001"
version = "1.0.0.0"

# A path parameter that means something else under one prefix (most specific prefix first)
[path_by_prefix."/Artists/"]
name = "{found.artist}"
itemId = "{found.artist_id}"
[path_by_prefix."/Genres/"]
name = "{found.genre}"
[path_by_prefix."/MusicGenres/"]
name = "{found.music_genre}"
genreName = "{found.music_genre}"
[path_by_prefix."/Studios/"]
name = "{found.studio}"
[path_by_prefix."/Persons/"]
name = "{found.person}"
[path_by_prefix."/Packages/"]
name = "Intro Skipper"
[path_by_prefix."/FallbackFont/"]
name = "parity.ttf"
[path_by_prefix."/Audio/"]
itemId = "{found.track}"
container = "mp3"
playlistId = "main"
[path_by_prefix."/Songs/"]
itemId = "{found.track}"
[path_by_prefix."/Albums/"]
itemId = "{found.album}"
[path_by_prefix."/Shows/"]
itemId = "{series}"
[path_by_prefix."/Videos/{itemId}/hls"]
playlistId = "main"

# ── required query parameters, by name ─────────────────────────────────────────────────────────────
[query]
app = "parity"
ids = "{movie}"
id = "{movie}"
client = "emby"
path = "/media"
runtimeTicks = 0
actualSegmentLengthTicks = 0
mediaSourceId = "{movie}"
deviceId = "parity"
playSessionId = "parity"
newIndex = 0
liveStreamId = "parity"
fileName = "parity.lrc"
code = "000000"
secret = "parity"
type = "Primary"
searchTerm = "{found.term}"
providerId = "parity"
itemId = "{movie}"
playCommand = "PlayNow"
itemIds = "{movie}"
itemType = "Movie"
itemName = "parity"
segmentLength = 3
name = "{found.log}"

# ── setup sequences a write reads from with {setup.<name>.…} (the last step's id is the name) ──────
[[setups.playlist]]
id = "playlist"
method = "POST"
path = "/Playlists"
body = { Name = "Parity sweep", Ids = ["{movie}", "{hdr_movie}"], UserId = "{user}", MediaType = "Video" }

[[setups.collection]]
id = "collection"
method = "POST"
path = "/Collections"
query = { name = "Parity sweep", ids = "{movie}" }

[[setups.session]]
id = "session"
method = "GET"
path = "/Sessions"
query = { deviceId = "parity" }

[[setups.key]]
id = "key-create"
method = "POST"
path = "/Auth/Keys"
query = { app = "parity" }
expect_status = 204
[[setups.key]]
id = "key"
method = "GET"
path = "/Auth/Keys"

# ── per operation ───────────────────────────────────────────────────────────────────────────────────
# Known oracle traps (B9): a stall or failure there is `oracle failed`, never a Ferrofin difference.
[op.CreateBackup]
oracle_trap = "Jellyfin's backup holds its exclusive database lock and can outlast the request timeout"
[op.GetYears]
oracle_trap = "Jellyfin's /Years fails or stalls on large libraries"
[op.GetQueryFiltersLegacy]
oracle_trap = "Jellyfin's /Items/Filters fails or stalls on large libraries"

[op.CreatePlaylist]
body = { Name = "Parity sweep", Ids = ["{movie}", "{hdr_movie}"], UserId = "{user}", MediaType = "Video" }
[op.GetPlaylist]
readback_of = "CreatePlaylist"
path = "/Playlists/{write.Id}"
[op.GetPlaylistItems]
readback_of = "CreatePlaylist"
path = "/Playlists/{write.Id}/Items"
query = { userId = "{user}" }
[op.GetPlaylistUsers]
readback_of = "CreatePlaylist"
path = "/Playlists/{write.Id}/Users"
[op.GetPlaylistUser]
readback_of = "CreatePlaylist"
path = "/Playlists/{write.Id}/Users/{user}"
[op.GetInstantMixFromPlaylist]
readback_of = "CreatePlaylist"
path = "/Playlists/{write.Id}/InstantMix"
query = { userId = "{user}", limit = 20 }
[op.AddItemToPlaylist]
query = { ids = "{hdr_movie}", userId = "{user}" }
[op.RemoveItemFromPlaylist]
query = { entryIds = "{movie}" }
[op.MoveItem]
path = "/Playlists/{setup.playlist.Id}/Items/{movie}/Move/1"
[op.UpdatePlaylist]
body = { Name = "Parity sweep renamed" }
[op.UpdatePlaylistUser]
path = "/Playlists/{setup.playlist.Id}/Users/{viewer}"
body = { CanEdit = true }
[op.RemoveUserFromPlaylist]
path = "/Playlists/{setup.playlist.Id}/Users/{viewer}"
setup = [{ id = "share", method = "POST", path = "/Playlists/{setup.playlist.Id}/Users/{viewer}", body = { CanEdit = false }, expect_status = 204 }]

[op.CreateCollection]
query = { name = "Parity sweep", ids = "{movie}" }
[op.AddToCollection]
query = { ids = "{hdr_movie}" }

[op.GetInstantMixFromArtists2]
query = { id = "{found.artist_id}" }
[op.GetInstantMixFromMusicGenreById]
query = { id = "{found.music_genre_id}" }
[op.GetDeviceInfo]
query = { id = "parity" }
[op.GetDeviceOptions]
query = { id = "parity" }
expect_status = 404   # the device has no options saved
[op.UpdateDeviceOptions]
query = { id = "parity" }
body = { CustomName = "Parity device" }
[op.DeleteDevice]
query = { id = "parity" }

[op.SendPlaystateCommand]
path = "/Sessions/{setup.session.0.Id}/Playing/Pause"
[op.SendSystemCommand]
path = "/Sessions/{setup.session.0.Id}/System/GoHome"
[op.SendGeneralCommand]
path = "/Sessions/{setup.session.0.Id}/Command/DisplayMessage"
[op.SendFullGeneralCommand]
body = { Name = "DisplayMessage", Arguments = { Header = "Parity", Text = "sweep" } }
[op.SendMessageCommand]
body = { Header = "Parity", Text = "sweep", TimeoutMs = 1000 }
[op.AddUserToSession]
path = "/Sessions/{setup.session.0.Id}/User/{viewer}"
[op.RemoveUserFromSession]
path = "/Sessions/{setup.session.0.Id}/User/{viewer}"
[op.DisplayContent]
query = { itemType = "Movie", itemId = "{movie}", itemName = "parity" }

[op.UpdateItemUserData]
body = { PlaybackPositionTicks = 100000000, Played = false }
[op.UpdateUserItemRating]
query = { likes = true }
[op.GetPostedPlaybackInfo]
query = { userId = "{user}" }
body = { UserId = "{user}", MaxStreamingBitrate = 120000000 }
[op.ReportPlaybackStart]
body = { ItemId = "{movie}", PlaySessionId = "parity", PositionTicks = 0, CanSeek = true, PlayMethod = "DirectPlay" }
[op.ReportPlaybackProgress]
body = { ItemId = "{movie}", PlaySessionId = "parity", PositionTicks = 100000000, CanSeek = true, PlayMethod = "DirectPlay" }
[op.ReportPlaybackStopped]
body = { ItemId = "{movie}", PlaySessionId = "parity", PositionTicks = 100000000 }
[op.PostFullCapabilities]
body = { PlayableMediaTypes = ["Video", "Audio"], SupportedCommands = ["DisplayMessage"], SupportsMediaControl = true }
[op.UpdateDisplayPreferences]
body = { Client = "emby", SortBy = "SortName", CustomPrefs = { homesection0 = "resume" } }
[op.UpdateUserConfiguration]
query = { userId = "{user}" }
body = { PlayDefaultAudioTrack = true, SubtitleMode = "Default", OrderedViews = [], LatestItemsExcludes = [], MyMediaExcludes = [] }
[op.UpdateUserPassword]
query = { userId = "{viewer}" }
body = { CurrentPw = "", NewPw = "parity" }
[op.CreateUserByName]
body = { Name = "parity-user", Password = "parity" }
[op.AuthenticateUserByName]
body = { Username = "{user_name}", Pw = "{password}" }
[op.ForgotPassword]
body = { EnteredUsername = "nobody" }
[op.ForgotPasswordPin]
body = { Pin = "0000" }
expect_status = 404   # no reset pin was issued
[op.ValidatePath]
body = { ValidateWritable = false, Path = "/media", IsFile = false }
[op.UpdateNamedConfiguration]
path = "/System/Configuration/network"
[op.GetNamedConfiguration]
path = "/System/Configuration/network"
[op.SetRepositories]
body = []
[op.UpdateTask]
path = "/ScheduledTasks/{found.task}/Triggers"
body = []
[op.SetItemImage]
expect_status = 400
[op.SetItemImageByIndex]
expect_status = 400
[op.PostUserImage]
expect_status = 400
[op.UploadCustomSplashscreen]
expect_status = 400

# ── documented-parameter combinations for the query-heavy operations (combos.jsonl) ────────────────
[combos]
ops = ["GetItems", "GetGenres", "GetStudios", "GetPersons", "GetArtists", "GetAlbumArtists", "GetMusicGenres",
       "GetEpisodes", "GetSeasons", "GetNextUp", "GetUpcomingEpisodes", "GetLatestMedia", "GetResumeItems"]
# parameters a combination never varies on its own (identity, paging and the base query below)
skip = ["userId", "limit", "startIndex", "enableTotalRecordCount"]
base_query = { userId = "{user}", limit = 20 }

[combos.base]
GetItems = { userId = "{user}", recursive = true, limit = 20 }
GetEpisodes = { userId = "{user}", limit = 20 }
GetSeasons = { userId = "{user}" }

# values for the documented parameters that are neither enumerated nor boolean
[combos.values]
parentId = ["{views.movies}", "{views.tvshows}", "{views.music}"]
searchTerm = ["{found.term}"]
nameStartsWith = ["A"]
nameStartsWithOrGreater = ["M"]
nameLessThan = ["M"]
years = ["2003"]
seasonId = ["{season}"]
seriesId = ["{series}"]
genres = ["{found.genre}"]
studios = ["{found.studio}"]
person = ["{found.person}"]
ids = ["{movie},{hdr_movie}"]


<svg xmlns='http://www.w3.org/2000/svg' width='760' height='202' viewBox='0 0 760 202' font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role='img'><title>Time to first screen: speed-up: Ferrofin against Jellyfin 12.4.0 on 3 comparable cells, as fast or faster on 3; from 2.0× faster to 13.0× faster.</title><text x='0.0' y='18.0' font-size='15' fill='#1A1E24' text-anchor='start' font-weight='600'>Time to first screen: speed-up</text><rect x='0.0' y='30' width='11' height='11' rx='2' fill='#2E6E8E'/><text x='16.0' y='40.0' font-size='12' fill='#5B636E' text-anchor='start'>Ferrofin faster</text><rect x='142.4' y='30' width='11' height='11' rx='2' fill='#B7791F'/><text x='158.4' y='40.0' font-size='12' fill='#5B636E' text-anchor='start'>Ferrofin slower</text><line x1='167.1' y1='54' x2='167.1' y2='126.0' stroke='#5B636E' stroke-width='1'/><text x='167.1' y='141.0' font-size='11' fill='#5B636E' text-anchor='middle'>1×</text><line x1='258.1' y1='54' x2='258.1' y2='126.0' stroke='#E1E5EA' stroke-width='1'/><text x='258.1' y='141.0' font-size='11' fill='#5B636E' text-anchor='middle'>2×</text><line x1='349.1' y1='54' x2='349.1' y2='126.0' stroke='#E1E5EA' stroke-width='1'/><text x='349.1' y='141.0' font-size='11' fill='#5B636E' text-anchor='middle'>4×</text><line x1='440.1' y1='54' x2='440.1' y2='126.0' stroke='#E1E5EA' stroke-width='1'/><text x='440.1' y='141.0' font-size='11' fill='#5B636E' text-anchor='middle'>8×</text><line x1='531.1' y1='54' x2='531.1' y2='126.0' stroke='#E1E5EA' stroke-width='1'/><text x='531.1' y='141.0' font-size='11' fill='#5B636E' text-anchor='middle'>16×</text><text x='349.1' y='158.0' font-size='12' fill='#5B636E' text-anchor='middle'>times faster than Jellyfin 12.4.0 (median, log scale; right of 1× is faster)</text><text x='157.1' y='71.0' font-size='12' fill='#1A1E24' text-anchor='end'>cold start</text><rect x='167.1' y='60.0' width='337.0' height='14' rx='2' fill='#2E6E8E'/><text x='509.1' y='71.0' font-size='11' fill='#2E6E8E' text-anchor='start'>13.0× faster  ·  250 ms vs 3257 ms</text><text x='157.1' y='93.0' font-size='12' fill='#1A1E24' text-anchor='end'>direct-play first byte</text><rect x='167.1' y='82.0' width='224.0' height='14' rx='2' fill='#2E6E8E'/><text x='396.1' y='93.0' font-size='11' fill='#2E6E8E' text-anchor='start'>5.5× faster  ·  0.71 ms vs 3.91 ms</text><text x='157.1' y='115.0' font-size='12' fill='#1A1E24' text-anchor='end'>HLS first segment</text><rect x='167.1' y='104.0' width='88.2' height='14' rx='2' fill='#2E6E8E'/><text x='260.3' y='115.0' font-size='11' fill='#2E6E8E' text-anchor='start'>2.0× faster  ·  168 ms vs 329 ms</text><text x='0.0' y='180.0' font-size='11' fill='#5B636E' text-anchor='start'>Ferrofin v1.5.0 (commit 961c0b41) against Jellyfin 12.4.0, the median of 3 runs on one host (32 cores, 125 GiB), 2026-11-08.</text><text x='0.0' y='195.0' font-size='11' fill='#5B636E' text-anchor='start'>Every number and its range: docs/BENCHMARKS.md</text></svg>

<svg xmlns='http://www.w3.org/2000/svg' width='760' height='202' viewBox='0 0 760 202' font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role='img'><title>Time to first screen: speed-up: Ferrofin against Jellyfin 12.2.0 on 3 comparable cells, as fast or faster on 3; from 2.3× faster to 12.1× faster.</title><text x='0.0' y='18.0' font-size='15' fill='#E7EAEE' text-anchor='start' font-weight='600'>Time to first screen: speed-up</text><rect x='0.0' y='30' width='11' height='11' rx='2' fill='#6FB3D2'/><text x='16.0' y='40.0' font-size='12' fill='#9AA3AE' text-anchor='start'>Ferrofin faster</text><rect x='142.4' y='30' width='11' height='11' rx='2' fill='#E0B25A'/><text x='158.4' y='40.0' font-size='12' fill='#9AA3AE' text-anchor='start'>Ferrofin slower</text><line x1='167.1' y1='54' x2='167.1' y2='126.0' stroke='#9AA3AE' stroke-width='1'/><text x='167.1' y='141.0' font-size='11' fill='#9AA3AE' text-anchor='middle'>1×</text><line x1='258.1' y1='54' x2='258.1' y2='126.0' stroke='#2B323C' stroke-width='1'/><text x='258.1' y='141.0' font-size='11' fill='#9AA3AE' text-anchor='middle'>2×</text><line x1='349.1' y1='54' x2='349.1' y2='126.0' stroke='#2B323C' stroke-width='1'/><text x='349.1' y='141.0' font-size='11' fill='#9AA3AE' text-anchor='middle'>4×</text><line x1='440.1' y1='54' x2='440.1' y2='126.0' stroke='#2B323C' stroke-width='1'/><text x='440.1' y='141.0' font-size='11' fill='#9AA3AE' text-anchor='middle'>8×</text><line x1='531.1' y1='54' x2='531.1' y2='126.0' stroke='#2B323C' stroke-width='1'/><text x='531.1' y='141.0' font-size='11' fill='#9AA3AE' text-anchor='middle'>16×</text><text x='349.1' y='158.0' font-size='12' fill='#9AA3AE' text-anchor='middle'>times faster than Jellyfin 12.2.0 (median, log scale; right of 1× is faster)</text><text x='157.1' y='71.0' font-size='12' fill='#E7EAEE' text-anchor='end'>cold start</text><rect x='167.1' y='60.0' width='327.5' height='14' rx='2' fill='#6FB3D2'/><text x='499.6' y='71.0' font-size='11' fill='#6FB3D2' text-anchor='start'>12.1× faster  ·  275 ms vs 3333 ms</text><text x='157.1' y='93.0' font-size='12' fill='#E7EAEE' text-anchor='end'>direct-play first byte</text><rect x='167.1' y='82.0' width='244.4' height='14' rx='2' fill='#6FB3D2'/><text x='416.6' y='93.0' font-size='11' fill='#6FB3D2' text-anchor='start'>6.4× faster  ·  0.64 ms vs 4.12 ms</text><text x='157.1' y='115.0' font-size='12' fill='#E7EAEE' text-anchor='end'>HLS first segment</text><rect x='167.1' y='104.0' width='111.7' height='14' rx='2' fill='#6FB3D2'/><text x='283.9' y='115.0' font-size='11' fill='#6FB3D2' text-anchor='start'>2.3× faster  ·  184 ms vs 431 ms</text><text x='0.0' y='180.0' font-size='11' fill='#9AA3AE' text-anchor='start'>Ferrofin v1.4.0 (commit 5112240e) against Jellyfin 12.2.0, the median of 3 runs on one host (32 cores, 125 GiB), 2026-10-26.</text><text x='0.0' y='195.0' font-size='11' fill='#9AA3AE' text-anchor='start'>Every number and its range: docs/BENCHMARKS.md</text></svg>
